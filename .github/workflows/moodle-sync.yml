name: Moodle daily sync
on:
  schedule:
    - cron: '17 6 * * *'   # every day around 06:17 UTC (GitHub may start it a little late)
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/moodle-sync.mjs
        env:
          MOODLE_ICS_URL: ${{ secrets.MOODLE_ICS_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LYRA_USER_ID: ${{ secrets.LYRA_USER_ID }}
