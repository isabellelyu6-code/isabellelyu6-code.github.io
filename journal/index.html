<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>Lyra · 日记</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
<!--
  Ego Journal — open-source, single-file journal app. MIT License.
  Storage: Claude artifact private db when available, otherwise IndexedDB in this browser.
-->
<style>
/* VOICE: quiet, private — the same slate night palette as her Nordic trip page, but a reading notebook, not a dashboard
   IDEA: a diary laid out as a timeline down a single reading column; each 分区 is a coloured node on the line
   PICTURE: today's prompt as a pull-quote, then the timeline of entries
   COLOUR and TYPE: slate night ground, snow ink, aurora-teal accent and dates; Noto Serif SC headings and writing, Noto Sans SC UI
   LAYOUT: one centred column up to 760px; tab bar at bottom on phones, left rail on wide screens */
:root{color-scheme:dark;--bf:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--hf:"Noto Serif SC","Songti SC",serif;--bg:#0f1b2d;--bg2:#0b1524;--card:#152439;--card2:#1a2c45;--line:#263b58;--ink:#eef3fa;--mut:#9fb1c9;--acc:#86d9c3;--acc2:#5fb8a4;--rose:#e9b0c2;--sun:#e8c98e;--accInk:#08261b;--mark:rgba(134,217,195,.3);--hero:#0f1b2d}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--bf);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:var(--hf)}
.disp{font-family:var(--hf);font-weight:900;letter-spacing:0;text-wrap:balance}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;padding-bottom:76px}
.rail{display:none}
main{max-width:880px;width:100%;margin:0 auto}
.jside{display:none}
body.bggrad{background:linear-gradient(165deg,var(--bg) 0%,var(--bg) 35%,var(--bgG) 100%) fixed}body.bggrad .hero{background:transparent}.as-open{display:none}
.ctx{position:fixed;z-index:90;min-width:190px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:ctxin .12s ease-out}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink)}
.ctx button:hover,.ctx button:focus{background:color-mix(in srgb,var(--acc) 16%,transparent);outline:none}
.ctx button.danger{color:#f0a0a8}.ctx .ci{width:18px;text-align:center;color:var(--mut);font-size:13px}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
@keyframes ctxin{from{opacity:0;transform:scale(.97)}}
.card,.nbtab,.rail .nb{-webkit-touch-callout:none}
.as-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);letter-spacing:.08em;margin-bottom:-4px}
.as-head button{font-size:12px;color:var(--mut);padding:4px 8px;border-radius:8px;letter-spacing:0}.as-head button:hover{background:var(--card);color:var(--acc)}
@media (min-width:1240px){
  main:has(.jwrap){max-width:1180px}
  .jwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px}
  .jwrap.noside{grid-template-columns:minmax(0,1fr);max-width:820px;margin:0 auto}
  .as-open{display:block;position:fixed;right:0;top:40%;z-index:30;writing-mode:vertical-rl;padding:12px 7px;border-radius:12px 0 0 12px;background:var(--card2);border:1px solid var(--line);border-right:0;color:var(--mut);font-size:12.5px;letter-spacing:.1em}
  .as-open:hover{color:var(--acc)}
  .jwrap:not(.noside) .hero .otd{display:none}
  .jmain{min-width:0}
  .jside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:30px 22px 30px 18px;border-left:1px solid var(--line);scrollbar-width:none}
}
.as-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.as-stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.as-stats b{display:block;font-family:var(--hf);font-size:24px;line-height:1.1;color:var(--acc)}
.as-stats span{font-size:11.5px;color:var(--mut)}
.as-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.as-card h4{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.mcal span{font-size:10.5px;color:var(--mut);padding-bottom:2px}
.mcal button,.mcal i{height:28px;border-radius:8px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.mcal button.has{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--ink);font-weight:600}
.mcal button.has:hover,.mcal button.on{background:var(--acc);color:var(--accInk)}
.mcal button.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.mcal button:disabled{cursor:default}
.as-row{display:flex;gap:10px;width:100%;text-align:left;padding:6px 0;font-size:13.5px;border-top:1px solid var(--line)}
.as-row:first-of-type{border-top:0}.as-row b{color:var(--acc);font-weight:600}.as-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-bar{display:grid;grid-template-columns:minmax(0,1fr) 60px 26px;gap:8px;align-items:center;width:100%;padding:4px 0;font-size:13px;text-align:left}
.as-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.as-bar i{height:6px;border-radius:3px;background:var(--c);display:block}.as-bar em{font-style:normal;color:var(--mut);font-size:12px;text-align:right}
.tabs{position:fixed;inset:auto 0 0 0;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{height:60px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=true]{color:var(--acc)}
.hero{position:relative;overflow:hidden;background:var(--hero);padding:30px max(5vw,18px) 24px;border-bottom:1px solid var(--line)}

.snow{background-image:radial-gradient(circle,#cfe3ff40 1px,transparent 1.5px),radial-gradient(circle,#cfe3ff26 1.3px,transparent 1.8px);background-size:120px 90px,170px 130px;background-position:10px 20px,70px 60px}
.hero h1,.hero .sub,.hero .prompt{text-shadow:0 1px 12px rgba(10,20,40,.85)}
.hero>*{position:relative}
.hero h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.hero .sub{color:var(--mut);font-size:15px}
.hero .sub b{color:var(--acc);font-weight:600}
.hero .prompt{margin:18px 0 16px;font-size:18px;max-width:34em;line-height:1.6}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:22px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:15px}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.pri:hover{background:#a3e6d4}
.btn.ghost{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.danger{color:#ff8a8a;border:1px solid rgba(255,138,138,.5)}
.btn:disabled{opacity:.5}
.otd{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.otd button{color:var(--acc);text-decoration:underline;text-underline-offset:3px;padding:0;text-align:left}
.bar{padding:14px max(5vw,16px) 8px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10;border-bottom:1px solid transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;border:0;background:none;font-size:16px;outline:none;height:100%}
.search svg{width:18px;height:18px;color:var(--mut);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:var(--card);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
.chip small{opacity:.7;font-size:12px}
.nbtabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.nbtabs::-webkit-scrollbar{display:none}
.nbtab{flex:none;height:34px;padding:0 12px;border-radius:17px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.nbtab span{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.nbtab[aria-pressed=true]{background:color-mix(in srgb,var(--c) 24%,var(--card));border-color:var(--c);font-weight:600}
.nbtab.add{color:var(--mut);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.list{padding:0 max(5vw,16px) 40px}
.month{font-size:13px;color:var(--mut);margin:24px 0 10px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;padding:14px 14px 14px 12px;margin:0 0 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;position:relative;overflow:hidden;transition:border-color .15s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#3ddc97)}
.card:hover{border-color:var(--c,#3ddc97)}
.card .d{text-align:center;padding-top:2px}
.card .d b{display:block;font-size:26px;line-height:1;font-family:var(--hf);font-weight:900;color:var(--acc)}
.card .d span{font-size:12px;color:var(--mut)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:700;font-family:var(--hf);line-height:1.4}
.card p{margin:0;color:#b9c5dc;font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--mut);margin-top:9px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.nbi{margin-right:5px}
.ednbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ednbs button{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line);font-size:13px;color:var(--mut);background:var(--card)}
.ednbs button[aria-pressed=true]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.card.picked{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.card.picked::after{content:"✓";position:absolute;right:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:700;font-size:14px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:8px 10px 8px 16px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:14px;white-space:nowrap;max-width:calc(100vw - 24px);overflow-x:auto}
.selbar .btn{height:34px;font-size:13px}
.fontc .chip{font-size:15px}
.chips.wrapc{flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:10px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);font-weight:600}
.thumbs{display:flex;gap:6px;margin-top:10px;overflow:hidden}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--card2)}
mark{background:var(--mark);color:#fff;border-radius:3px;padding:0 1px}
.empty{padding:48px 8px;text-align:center;color:var(--mut)}
.empty h2{color:var(--ink);font-size:24px;margin:0 0 8px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.fab{position:fixed;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:var(--accInk);box-shadow:0 8px 24px rgba(134,217,195,.35);z-index:15;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.section{padding:22px max(5vw,16px)}
.section h2{font-size:26px;margin:0 0 12px}
.section h3{font-size:16px;margin:26px 0 10px;color:var(--ink);display:flex;align-items:center;gap:8px}
.section h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
.muted{color:var(--mut);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:22px;font-family:var(--hf);font-weight:700}
.icon{width:44px;height:44px;border-radius:22px;display:grid;place-items:center}
.icon:hover{background:var(--card)}
.icon svg{width:20px;height:20px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.grid7 .wd{font-size:12px;color:var(--mut);text-align:center;padding:4px 0}
.day{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;gap:3px;position:relative}
.day.out{background:none;border-color:transparent;color:var(--mut);opacity:.4}
.day.today{border-color:var(--acc);color:var(--acc)}
.day .dots{display:flex;gap:2px;height:7px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day.has{font-weight:700;background:var(--card2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:clamp(28px,6vw,36px);line-height:1.1;font-family:var(--hf);font-weight:700;color:var(--acc)}
.stat span{font-size:13px;color:var(--mut)}
.hbar{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.5em;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.hbar .t{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px}
.hbar em{font-style:normal;text-align:right;color:var(--mut)}
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:130px;margin-top:10px}
.months div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.months i{width:100%;max-width:26px;background:linear-gradient(var(--acc),var(--acc2));border-radius:5px 5px 2px 2px;min-height:2px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-size:14px;color:var(--mut)}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=datetime-local]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
textarea{resize:vertical}
.nbrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--bg)}
/* reports */
.seg2{display:inline-grid;grid-auto-flow:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg2 button{height:38px;padding:0 16px;border-radius:9px;color:var(--mut);font-weight:600}
.seg2 button[aria-pressed=true]{background:var(--acc);color:var(--accInk)}
.rep-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rep-nav{display:flex;align-items:center;gap:4px}
.rep-nav b{font-size:15px;min-width:9em;text-align:center}
.report{background:linear-gradient(180deg,rgba(134,217,195,.08),transparent 40%),var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.8;font-size:15.5px}
.report h4{font-size:16px;margin:16px 0 6px;color:var(--acc)}
.report h4:first-child{margin-top:0}
.report p{margin:6px 0}
.report ul{margin:6px 0;padding-left:1.2em}
.report li{margin:3px 0}
.report .src{font-size:13px;color:var(--mut);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.progress{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
/* editor sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sh-top{display:flex;align-items:center;gap:8px;padding:8px max(4vw,10px);border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}
.sh-top .st{flex:1;font-size:13px;color:var(--mut);text-align:center}
.sh-body{flex:1;overflow-y:auto;padding:16px max(5vw,18px) 120px;max-width:760px;width:100%;margin:0 auto}
.ed-meta{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ed-title{border:0!important;padding:14px 0 4px!important;font-size:26px!important;font-weight:700;font-family:var(--hf);background:none!important;outline:none}
.ed-text{border:0!important;padding:6px 0!important;font-size:17px!important;line-height:1.9;font-family:var(--hf);min-height:40vh;background:none!important;outline:none;resize:none}
.tools{position:sticky;bottom:0;display:flex;gap:4px;overflow-x:auto;padding:8px max(4vw,10px);border-top:1px solid var(--line);background:var(--bg2);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.tools button{flex:none;height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;color:var(--ink)}
.tools button:hover{background:var(--card)}
.tools button svg{width:20px;height:20px;color:var(--acc)}
.tools button.on{background:var(--acc);color:var(--accInk)}
.tools button.on svg{color:var(--accInk)}
.moods{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.moods button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;opacity:.5}
.moods button[aria-pressed=true]{opacity:1;border-color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:12px 0}
.photos figure{margin:0;position:relative;aspect-ratio:1}
.photos img{width:100%;height:100%;object-fit:cover;border-radius:12px;background:var(--card)}
.photos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.tagin .chip{height:30px}
.tagin input{flex:1;min-width:8em;border:0!important;padding:4px!important;min-height:34px;background:none!important}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(3,8,20,.7);z-index:60;display:grid;place-items:center;padding:18px}
.modal[hidden]{display:none}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:460px;width:100%;max-height:86vh;overflow:auto}
.box h3{margin:0 0 8px;font-size:19px}
.box .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:grid;place-items:center}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;color:#fff;background:rgba(255,255,255,.18)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:90vw;font-weight:500}
.toast[hidden]{display:none}
.banner{margin:10px max(5vw,16px) 0;padding:10px 14px;border-radius:12px;background:rgba(240,180,124,.15);border:1px solid rgba(240,180,124,.4);font-size:14px}
.lock{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:max(10vh,24px) 20px 20px;overflow-y:auto}
.lock[hidden]{display:none}
.auth{width:100%;max-width:380px;display:flex;flex-direction:column;position:relative;z-index:1}
.auth label{font-size:14px;color:var(--mut);margin:12px 0 6px}
.auth .remember{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--ink);font-size:15px}
.auth .remember input{width:20px;height:20px;accent-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{height:40px;border-radius:9px;color:var(--mut);font-weight:600}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accInk)}
.warn{font-size:13px;background:rgba(240,180,124,.12);border:1px solid rgba(240,180,124,.35);border-radius:10px;padding:10px 12px;margin:14px 0 0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.card>div{transition:none}}
/* ---- diary layout: a quiet reading column with a timeline, unlike the hub's dashboard ---- */
main{max-width:760px}
.hero{background:none;border:0;padding:26px max(5vw,18px) 6px;overflow:visible}
.hero h1{font-size:clamp(28px,6vw,40px);margin:0 0 4px}
.hero .sub{font-size:14px}
.hero .prompt{margin:14px 0 12px;padding:12px 16px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 14px 14px 0;font-family:var(--hf);font-size:16.5px;max-width:none}
.hero .row .btn{height:38px;font-size:14px}
@media (min-width:900px){.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:end}.hero h1,.hero .sub,.hero .otd,.hero>div:not(.row){grid-column:1/-1}.hero .prompt{grid-column:1;margin-bottom:0}.hero .row{grid-column:2;flex-wrap:nowrap}}
.hero .otd{border-top:0;padding-top:4px}
.bar{background:color-mix(in srgb,var(--bg) 96%,transparent)}
.month{font-family:var(--hf);font-size:20px;font-weight:900;color:var(--ink);letter-spacing:0;margin:30px 0 12px}
.month::after{display:none}
.list{position:relative}
.card{overflow:visible;background:none;border:0;border-radius:0;margin:0;padding:0 0 22px 26px;grid-template-columns:minmax(0,1fr);gap:6px;border-left:2px solid var(--line);margin-left:7px}
.card:hover{border-color:var(--line)}
.card::before{left:-8px;top:4px;bottom:auto;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px var(--bg)}
.card .d{display:flex;align-items:baseline;gap:8px;text-align:left;padding:0}
.card .d b{font-size:18px;display:inline}
.card .d b::after{content:"日"}
.card .d span{font-size:13px}
.card>div:last-child{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .15s}
.card:hover>div:last-child{border-color:var(--c)}
.card p{color:#c4d0e3}
@media (min-width:900px){.hero{padding-top:36px}}

@media (min-width:900px){
  .app{padding-bottom:0}
  .tabs{display:none}
  .app{grid-template-columns:232px minmax(0,1fr)}

  .rail .nb:hover{background:var(--card)}

  .rail .nb em{font-style:normal;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  .rail .nb.all .ico{color:var(--acc)}
  .rail .more{width:100%;text-align:left;font-size:12.5px;color:var(--mut);padding:8px 8px}.rail .more:hover{color:var(--acc)}
  .rfoot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);padding:10px 8px 0;border-top:1px solid var(--line)}
  .rfoot button{color:var(--mut);font-size:12.5px}.rfoot button:hover{color:var(--bad,#f0a0a8)}
  .fab{bottom:28px;right:28px}
  .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .nbchips{display:none}
}

    const smp=[...list].sort(()=>Math.random()-.5).slice(0,120).map(e=>`- ${e.title||''} ${e.body.replace(/\s+/g,' ').slice(0,50)}`).join('\n');
    const cats=await call(`下面是一个人的日记标题和开头（共 ${list.length} 篇，这里是抽样）。请为这些日记设计 4 到 8 个"分区"（像文件夹），每个名字 2 到 4 个中文字，能覆盖大部分内容、互相不重叠，例如：学习、梦境、日常、情绪、朋友、恋爱、旅行、追星、灵感。${existing.length?'已有分区（合适就沿用）：'+existing.join('、')+'。':''}不要用"我的日记""其他"这种泛泛的名字。只返回 JSON 数组，例如 ["学习","梦境"]。\n\n${smp}`);
    const names=(Array.isArray(cats)?cats:[]).filter(x=>typeof x==='string').map(x=>x.trim().slice(0,8)).filter(Boolean).slice(0,8);
    if(!names.length)throw new Error('AI 没给出分区');
    for(const nm of names)if(!S.notebooks.find(n=>n.name===nm)){const nb={id:uid(),name:nm,color:COLORS[S.notebooks.length%COLORS.length],created:Date.now(),order:S.notebooks.length};S.notebooks.push(nb);await Store.put('notebooks',nb)}
    const B=8;
    for(let i=0;i<list.length&&!orgCancel;i+=B){
      const batch=list.slice(i,i+B);msg(`正在整理第 ${i+1}–${Math.min(i+B,list.length)} 篇，共 ${list.length} 篇`);
      const items=batch.map((e,j)=>`#${j}\n日期:${e.date.slice(0,10)}\n标题:${e.title}\n${e.body.slice(0,1200)}`).join('\n\n');
      let res;try{res=await call(`给每篇日记归类并提取信息。分区只能从这些里选一个：${names.join('、')}。\n返回 JSON 数组，每篇一项：{"i":序号,"notebook":"分区名","mood":1到7的整数(1非常不愉快,4平静,7非常愉快;看不出就4),"place":"日记里明确提到的主要地点，没有就空字符串","tags":["2到4个简短标签"]}。只返回 JSON。\n\n${items}`)}catch(e){if(e&&e.code==='not_granted')throw e;continue}
      for(const r of Array.isArray(res)?res:[]){const e=batch[r&&r.i];if(!e)continue;
        const nb=S.notebooks.find(n=>n.name===r.notebook);if(nb)e.nb=nb.id;
        if(!e.mood&&Number.isInteger(r.mood)&&r.mood>=1&&r.mood<=7)e.mood=r.mood;
        if(!e.place&&typeof r.place==='string'&&r.place.trim())e.place=r.place.trim().slice(0,60);
        if(Array.isArray(r.tags))for(const t of r.tags)if(typeof t==='string'&&t.trim()&&!e.tags.includes(t.trim())&&e.tags.length<8)e.tags.push(t.trim().slice(0,20));
        e.ai=1;e.updated=Date.now();try{await Store.put('entries',structuredClone(e));done++}catch(err){}}
      const bar=$('#orgBar');if(bar)bar.style.width=Math.min(100,Math.round((i+B)/list.length*100))+'%';
    }
    const def=S.notebooks.find(n=>n.name==='我的日记');
    if(def&&S.notebooks.length>1&&!S.entries.some(e=>e.nb===def.id)){S.notebooks=S.notebooks.filter(n=>n!==def);Store.del('notebooks',def.id).catch(()=>{});if(S.nb===def.id)S.nb='all'}
    closeModal();render();toast(orgCancel?`已停止，整理了 ${done} 篇`:`整理好了 ${done} 篇：分区、心情、地点、标签都加上了`,5000);
  }catch(e){closeModal();render();toast(e&&e.code==='not_granted'?'没有允许使用 AI':`AI 整理没完成${done?`（已整理 ${done} 篇）`:''}：${e.message||'请稍后再试'}`,5000)}
}

/* ---------- editor ---------- */
function newEntry(prompt){
  const nb=S.nb!=='all'&&nbById(S.nb)?S.nb:S.notebooks[0].id;
  openEditor({id:uid(),nb,date:localISO(new Date()),title:'',body:prompt?PROMPTS[S.prompt]+'\n\n':'',mood:null,tags:[],place:'',photos:[],thumbs:{},fav:false,created:Date.now(),updated:Date.now()},true);
}
function openEditor(e,isNew=false){
  S.ed=fixEntry(structuredClone(e));S.edNew=isNew;S.dirty=false;
  $('#edBody').innerHTML=`<div class="ed-meta"><input type="datetime-local" id="edDate" value="${esc(S.ed.date)}" aria-label="日期时间"><span></span></div><div class="ednbs" id="edNbs" role="group" aria-label="分区（可多选）">${S.notebooks.map(n=>`<button type="button" data-ednb="${esc(n.id)}" style="--c:${esc(n.color)}" aria-pressed="${inNb(S.ed,n.id)}">${nbLabel(n)}</button>`).join('')}</div>
   <input type="text" class="ed-title" id="edTitle" placeholder="标题" value="${esc(S.ed.title)}">
   <div class="photos" id="edPhotos"></div>
   <textarea class="ed-text" id="edText" placeholder="开始写…">${esc(S.ed.body)}</textarea>
   <div class="moods" id="edMoods"></div>
   <div class="field"><label for="edPlace">地点</label><input type="text" id="edPlace" value="${esc(S.ed.place)}" placeholder="例如：UCL 图书馆"></div>
   <div class="field"><label for="edTagIn">标签</label><div class="tagin" id="edTags"></div></div>`;
  $('#edTools').innerHTML=`<button data-t="photo">${IC.photo}照片</button><button data-t="ocr">${IC.scan}识别文字</button><button data-t="mic" id="micBtn">${IC.mic}语音</button>${caps.sample?`<button data-t="ai">${IC.spark}智能标签</button>`:''}`;
  renderEdPhotos();renderEdMoods();renderEdTags();renderEdFav();
  $('#edStatus').textContent=isNew?'新日记':'';
  $('#editor').hidden=false;document.body.style.overflow='hidden';
  autosize();if(isNew)setTimeout(()=>$('#edText').focus(),60);
}
function autosize(){const t=$('#edText');if(!t)return;t.style.height='auto';t.style.height=Math.max(t.scrollHeight,window.innerHeight*.4)+'px'}
function renderEdFav(){$('#edFav').innerHTML=S.ed.fav?IC.starF:IC.star;$('#edFav').setAttribute('aria-pressed',S.ed.fav)}
function renderEdMoods(){$('#edMoods').innerHTML=`<span class="muted" style="margin-right:4px">心情</span>`+MOODS.map((m,i)=>`<button data-mood-set="${i+1}" style="background:${m.c}" aria-pressed="${S.ed.mood===i+1}" aria-label="${m.n}" title="${m.n}"></button>`).join('')+`<span class="muted" id="moodName">${S.ed.mood?MOODS[S.ed.mood-1].n:''}</span>`}
function renderEdTags(){$('#edTags').innerHTML=S.ed.tags.map((t,i)=>`<button class="chip" data-tagdel="${i}">#${esc(t)} ✕</button>`).join('')+`<input type="text" id="edTagIn" placeholder="输入后按回车，空格分隔多个">`}
function renderEdPhotos(){const e=S.ed;$('#edPhotos').innerHTML=e.photos.map(p=>`<figure><img src="${esc(S.photos.get(p)||e.thumbs[p]||'')}" data-view="${esc(p)}" alt="照片"><button class="x" data-pdel="${esc(p)}" aria-label="移除照片">✕</button></figure>`).join('');$('#edPhotos').style.display=e.photos.length?'':'none'}
let saveT=null;
function touch(){S.dirty=true;$('#edStatus').textContent='编辑中…';clearTimeout(saveT);saveT=setTimeout(persist,1200)}
async function persist(){
  clearTimeout(saveT);const e=S.ed;if(!e||!S.dirty)return;
  if(!e.title.trim()&&!e.body.trim()&&!e.photos.length)return;
  S.dirty=false;e.updated=Date.now();const copy=structuredClone(e);
  const i=S.entries.findIndex(x=>x.id===e.id);if(i<0)S.entries.push(copy);else S.entries[i]=copy;S.edNew=false;
  $('#edStatus').textContent='保存中…';
  try{await Store.put('entries',copy);if(S.ed&&S.ed.id===copy.id)$('#edStatus').textContent='已保存'}
  catch(err){S.dirty=true;$('#edStatus').textContent='保存失败';toast(err&&err.code==='quota_exceeded'?'存储已满：请导出备份并删除一些照片':'保存失败，稍后会再试');saveT=setTimeout(persist,5000)}
}
async function closeEditor(){await persist();$('#editor').hidden=true;document.body.style.overflow='';S.ed=null;stopMic();render()}
$('#edClose').onclick=closeEditor;
$('#edFav').onclick=()=>{S.ed.fav=!S.ed.fav;renderEdFav();touch()};
$('#edDel').onclick=async()=>{const e=S.ed;if(!(await ask('删除这篇日记？','删除后无法恢复。','删除',true)))return;clearTimeout(saveT);S.entries=S.entries.filter(x=>x.id!==e.id);S.ed=null;$('#editor').hidden=true;document.body.style.overflow='';render();try{await Store.del('entries',e.id);for(const p of e.photos)await Store.del('photos',p)}catch(err){toast('删除失败')}};
$('#edBody').addEventListener('input',ev=>{const id=ev.target.id,e=S.ed;if(!e)return;
  if(id==='edTitle')e.title=ev.target.value;else if(id==='edText'){e.body=ev.target.value;autosize()}else if(id==='edPlace')e.place=ev.target.value;else if(id==='edDate'){if(ev.target.value)e.date=ev.target.value.slice(0,16)}else if(id==='edNb')e.nb=ev.target.value;else return;touch()});
$('#edBody').addEventListener('click',ev=>{const b=ev.target.closest('[data-ednb]');if(!b||!S.ed)return;const id=b.dataset.ednb;let L=nbsOf(S.ed);
  if(L.includes(id)){if(L.length===1)return toast('至少要在一个分区里');L=L.filter(x=>x!==id)}else L.push(id);
  S.ed.nb=L[0];S.ed.also=L.slice(1);$('#edNbs').querySelectorAll('[data-ednb]').forEach(x=>x.setAttribute('aria-pressed',L.includes(x.dataset.ednb)));touch()});
$('#edBody').addEventListener('change',ev=>{if(ev.target.id==='edNb'&&S.ed){S.ed.nb=ev.target.value;touch()}});
$('#edBody').addEventListener('keydown',ev=>{if(ev.target.id!=='edTagIn')return;if(ev.key==='Enter'||ev.key===','||ev.key==='，'){ev.preventDefault();addTags(ev.target.value)}else if(ev.key==='Backspace'&&!ev.target.value&&S.ed.tags.length){S.ed.tags.pop();renderEdTags();$('#edTagIn').focus();touch()}});
$('#edBody').addEventListener('focusout',ev=>{if(ev.target.id!=='edTagIn')return;const v=ev.target.value;if(!v.trim())return;ev.target.value='';setTimeout(()=>{if(S.ed)addTags(v,false)},0)});
function addTags(v,refocus=true){const inp=$('#edTagIn');if(inp)inp.value='';const ts=v.split(/[\s,，#]+/).map(s=>s.trim()).filter(Boolean);for(const t of ts)if(!S.ed.tags.includes(t))S.ed.tags.push(t.slice(0,30));renderEdTags();if(refocus)$('#edTagIn').focus();touch()}
$('#edBody').addEventListener('click',async ev=>{const t=ev.target.closest('button,img');if(!t)return;const e=S.ed;
  if(t.dataset.moodSet){const m=+t.dataset.moodSet;e.mood=e.mood===m?null:m;renderEdMoods();touch()}
  else if(t.dataset.tagdel){e.tags.splice(+t.dataset.tagdel,1);renderEdTags();touch()}
  else if(t.dataset.pdel){const p=t.dataset.pdel;e.photos=e.photos.filter(x=>x!==p);delete e.thumbs[p];renderEdPhotos();touch();Store.del('photos',p).catch(()=>{})}
  else if(t.dataset.view){viewPhoto(t.dataset.view)}});
$('#edTools').addEventListener('click',ev=>{const t=ev.target.closest('[data-t]');if(!t)return;const k=t.dataset.t;
  if(k==='photo')$('#filePhoto').click();else if(k==='ocr')$('#fileOcr').click();else if(k==='mic')toggleMic();else if(k==='ai')aiSuggest(t)});
$('#filePhoto').onchange=async ev=>{const fs=[...ev.target.files];ev.target.value='';if(!fs.length)return;toast('正在处理照片…',8000);for(const f of fs)await attachPhoto(S.ed,f);renderEdPhotos();touch();toast('已添加 '+fs.length+' 张照片')};
$('#fileOcr').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const e=S.ed;
  $('#edStatus').innerHTML='<span class="spin"></span> 正在识别文字…';
  try{await attachPhoto(e,f);renderEdPhotos();const txt=await ocr(f);if(S.ed!==e)return;const ta=$('#edText');e.body=(e.body.trim()?e.body.replace(/\s*$/,'\n\n'):'')+txt;ta.value=e.body;autosize();touch();toast(txt?'已识别并加入正文':'没有识别到文字')}
  catch(err){$('#edStatus').textContent='';toast('识别失败：'+(err.message||err))}};
async function viewPhoto(p){let src=S.photos.get(p);if(!src){try{const o=await Store.get('photos',p);if(o){src=o.data;S.photos.set(p,src)}}catch(e){}}if(!src)src=S.ed?.thumbs[p];if(!src)return toast('照片还没加载');$('#viewerImg').src=src;$('#viewer').hidden=false}
$('#viewerX').onclick=()=>{$('#viewer').hidden=true;$('#viewerImg').removeAttribute('src')};

/* ---------- photos ---------- */
async function toImg(file){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('无法读取这张图片'));i.src=URL.createObjectURL(file)})}}
async function resize(img,max,limit){let w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h)),q=.82,url='';
  for(let i=0;i<8;i++){const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<=limit)break;if(q>.55)q-=.12;else s*=.8}return url}
async function attachPhoto(e,file){const img=await toImg(file);const full=await resize(img,1600,175000),th=await resize(img,220,14000);const pid=uid();S.photos.set(pid,full);await Store.put('photos',{id:pid,data:full});e.photos.push(pid);if(Object.keys(e.thumbs).length<6)e.thumbs[pid]=th;return pid}

/* ---------- recognition ---------- */
async function ocr(file){
  if(caps.sample){
    let lim=null;try{lim=await caps.sample.limits()}catch(e){}
    if(lim&&lim.images){
      try{const img=await toImg(file);const url=await resize(img,1800,900000);const blob=await (await fetch(url)).blob();
        const r=await caps.sample('请识别这张图片里的全部文字（可能是手写或打印的日记，中文或英文）。按原来的段落输出纯文字；不要解释，不要加标题或引号；看不清的字用□代替。如果图片里没有文字，只回答：（无文字）',{images:[blob],modelTier:'default'});
        const t=(r.text||'').trim();return t==='（无文字）'?'':t}
      catch(e){if(e&&e.code==='rate_limited')throw new Error('请求太频繁，请稍后再试');if(e&&e.code!=='not_granted')throw new Error(e.message||'识别失败')}
    }
  }
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if(!window.Tesseract)throw new Error('识别组件没有加载');
  const r=await window.Tesseract.recognize(file,'chi_sim+eng');
  return (r.data.text||'').replace(/([㐀-鿿])\s+(?=[㐀-鿿])/g,'$1').trim();
}
async function aiSuggest(btn){
  const e=S.ed;if(!caps.sample)return;if(!e.body.trim()&&!e.title.trim())return toast('先写点内容');
  btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<span class="spin"></span>思考中';
  try{
    const ask=`你是日记整理助手。读下面这篇日记，返回 JSON：{"title":"不超过14字的标题","tags":["2到4个简短标签"],"mood":1到7的整数}。mood：1非常不愉快，2不愉快，3有点不愉快，4平静，5有点愉快，6愉快，7非常愉快。标签用日记的语言。只返回 JSON。\n\n日记：\n${(e.title+'\n'+e.body).slice(0,5000)}`;
    let v=typeof caps.sample.json==='function'?await caps.sample.json(ask,{modelTier:'quick'}):JSON.parse(((await caps.sample(ask,{modelTier:'quick'})).text||'').replace(/^[^{]*/,'').replace(/[^}]*$/,''));
    if(S.ed!==e)return;
    if(v&&typeof v.title==='string'&&!e.title.trim()){e.title=v.title.slice(0,40);$('#edTitle').value=e.title}
    if(v&&Array.isArray(v.tags))for(const t of v.tags)if(typeof t==='string'&&t.trim()&&!e.tags.includes(t.trim()))e.tags.push(t.trim().slice(0,30));
    if(v&&Number.isInteger(v.mood)&&v.mood>=1&&v.mood<=7&&!e.mood)e.mood=v.mood;
    renderEdTags();renderEdMoods();touch();toast('已补上标题、标签和心情（可以再改）');
  }catch(err){toast(err&&err.code==='rate_limited'?'请求太频繁，稍后再试':'暂时无法使用智能标签')}
  finally{btn.disabled=false;btn.innerHTML=old}
}

/* ---------- dictation ---------- */
let rec=null,listening=false;
function setupDictation(){const d=caps.dict;if(!d)return;try{d.onFinal(({text})=>appendSpeech(text));d.onState(({state})=>{listening=state==='listening';$('#micBtn')?.classList.toggle('on',listening)})}catch(e){}}
function appendSpeech(text){if(!S.ed||!text)return;const ta=$('#edText');S.ed.body+=text;if(ta){ta.value=S.ed.body;autosize()}touch()}
function toggleMic(){
  if(caps.dict){if(listening){caps.dict.stop().catch(()=>{});return}caps.dict.start().catch(e=>toast(e&&e.code==='not_granted'?'没有麦克风权限':'无法开始语音输入'));return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('这个浏览器不支持语音输入，可以用键盘上的麦克风');
  if(listening){stopMic();return}
  rec=new SR();rec.lang='zh-CN';rec.continuous=true;rec.interimResults=false;
  rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)appendSpeech(ev.results[i][0].transcript)};
  rec.onend=()=>{listening=false;$('#micBtn')?.classList.remove('on')};
  try{rec.start();listening=true;$('#micBtn').classList.add('on')}catch(e){toast('无法开始语音输入')}
}
function stopMic(){if(caps.dict&&listening){caps.dict.stop().catch(()=>{})}if(rec){try{rec.stop()}catch(e){}rec=null}listening=false}

/* ---------- right-click / long-press menu ---------- */
function ctxMenu(x,y,items){ctxClose();const m=document.createElement('div');m.className='ctx';m.setAttribute('role','menu');
  m.innerHTML=items.map((it,i)=>it==='-'?'<hr>':`<button role="menuitem" data-ci="${i}" class="${it.danger?'danger':''}">${it.icon?`<span class="ci">${it.icon}</span>`:''}${it.label}${it.hint?`<kbd>${it.hint}</kbd>`:''}</button>`).join('');
  document.body.appendChild(m);const r=m.getBoundingClientRect();m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';
  m.addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(!b)return;const it=items[+b.dataset.ci];ctxClose();it.act&&it.act()});

/* partition map: {notebooks:[{name,icon,color}], dated:'name', assign:[{nb,date,text}]} */
async function importMap(o){let made=0,set=0,miss=[];const byName=n=>S.notebooks.find(x=>x.name===n);
  if(o.rename)for(const [from,to] of Object.entries(o.rename)){const nb=byName(from);if(nb&&!byName(to)){nb.name=to;await Store.put('notebooks',structuredClone(nb))}}
  for(const [i,n] of (o.notebooks||[]).entries()){let nb=byName(n.name);if(!nb){nb={id:uid(),name:String(n.name).slice(0,30),color:COLORS.includes(n.color)?n.color:COLORS[i%COLORS.length],created:Date.now(),order:i};S.notebooks.push(nb);made++}nb.icon=n.icon||nb.icon||'';nb.order=i;await Store.put('notebooks',structuredClone(nb))}
  S.notebooks.sort((a,b)=>(a.order??99)-(b.order??99));
  const add=(e,nb)=>{const L=nbsOf(e);if(!L.includes(nb.id))L.push(nb.id);e.nb=L[0];e.also=L.slice(1);e._t=1};
  const clean=t=>String(t||'').replace(/[^\u4e00-\u9fff\u3040-\u30ffA-Za-z0-9]/g,'');
  const bi=t=>{const s=clean(t),B=new Set();for(let i=0;i<s.length-1;i++)B.add(s.slice(i,i+2));return B};
  if(o.dated){const nb=byName(o.dated);if(nb)for(const e of S.entries)if(isDateTitle(e.title))add(e,nb)}
  const EB=S.entries.map(e=>[e,bi((e.title||'')+(e.body||''))]);const hit={};
  for(const r of o.assign||[]){const nb=byName(r.nb);if(!nb)continue;const tb=bi(r.text);if(tb.size<12){miss.push(r);continue}
    let best=null,bs=0,second=0;for(const [e,B] of EB){if(r.date&&e.date.slice(0,10)!==r.date)continue;let k=0;for(const x of tb)if(B.has(x))k++;const v=k/tb.size;if(v>bs){second=bs;bs=v;best=e}else if(v>second)second=v}
    const th=o.loose?.4:.5;
    if(best&&bs>=th&&bs-second>=.15){add(best,nb);const key=nb.id+best.id;if(!hit[key]){hit[key]=1;set++}}
    else if(o.loose&&best&&bs>=.5){for(const [e,B] of EB){let k=0;for(const x of tb)if(B.has(x))k++;if(k/tb.size>=bs-.06){add(e,nb);const key=nb.id+e.id;if(!hit[key]){hit[key]=1;set++}}}}
    else miss.push(r)}
  if(o.cleanup){for(const name of o.cleanup){const nb=byName(name);if(nb&&!S.entries.some(e=>inNb(e,nb.id)&&!e._t)){/* keep */}}}
  for(const e of S.entries)if(e._t){delete e._t;if(o.drop){const rm=o.drop.map(byName).filter(Boolean).map(n=>n.id);const L=nbsOf(e).filter(x=>!rm.includes(x));if(L.length){e.nb=L[0];e.also=L.slice(1)}}await Store.put('entries',structuredClone(e)).catch(()=>{})}
  render();window.__lastMap={made,set,miss:miss.length,missed:miss.slice(0,40)};toast(`分区表：新建 ${made} 个分区，对上 ${set} 篇${miss.length?`，${miss.length} 条没对上`:''}`,6000)}

/* ---------- import ---------- */
const DATE_RE=/^\s*[#>*\-\s]*(\d{4})\s*[-./年]\s*(\d{1,2})\s*[-./月]\s*(\d{1,2})\s*日?(?:\s*(?:星期|周)[一二三四五六日天])?(?:\s*(\d{1,2})[:：](\d{2}))?\s*[，,:：\-—|]*\s*(.*)$/;
const MD_RE=/^\s*[#>*\-\s]*(\d{1,2})\s*月\s*(\d{1,2})\s*日(?:\s*(?:星期|周)[一二三四五六日天])?\s*[，,:：\-—|]*\s*(.*)$/;
function splitText(text,year,fallback,fallbackTitle){
  const lines=text.replace(/\r\n?/g,'\n').split('\n');const out=[];let cur=null;
  for(const ln of lines){let m=ln.length<80&&ln.match(DATE_RE),d=null,title='';
    if(m){d=new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:21,m[5]?+m[5]:0);title=m[6]}
    else if(ln.length<60&&(m=ln.match(MD_RE))){d=new Date(year,+m[1]-1,+m[2],21,0);title=m[3]}
    if(d&&!isNaN(d)&&d.getMonth()>=0){cur={date:localISO(d),title:title.replace(/^#+\s*/,'').trim().slice(0,60),body:[]};out.push(cur);continue}
    if(!cur){if(!ln.trim())continue;cur={date:localISO(fallback),title:fallbackTitle||'',body:[]};out.push(cur)}
    cur.body.push(ln)}
  return out.map(o=>({...o,body:o.body.join('\n').trim()})).filter(o=>o.body||o.title);
}
async function addImported(items,nb){let n=0;for(const it of items){const e=fixEntry({id:uid(),nb,date:it.date,title:it.title||'',body:it.body||'',created:Date.now(),updated:Date.now()});S.entries.push(e);await Store.put('entries',e);n++}return n}
async function importBackup(obj){let n=0;
  for(const nb of obj.notebooks||[])if(nb&&nb.id&&typeof nb.name==='string'){if(!nbById(nb.id))S.notebooks.push({id:String(nb.id),name:nb.name.slice(0,30),icon:[...String(nb.icon||'')].slice(0,2).join(''),color:COLORS.includes(nb.color)?nb.color:COLORS[0],created:nb.created||Date.now(),order:Number.isFinite(nb.order)?nb.order:S.notebooks.length});await Store.put('notebooks',structuredClone(nbById(nb.id)))}
  for(const p of obj.photos||[])if(p&&p.id&&typeof p.data==='string'&&p.data.startsWith('data:image/')){await Store.put('photos',{id:String(p.id),data:p.data});S.photos.set(p.id,p.data)}
  for(const r of obj.reports||[])if(r&&typeof r.id==='string'&&r.id.startsWith('rep:')&&typeof r.text==='string'){const rec={id:r.id,text:r.text.slice(0,50000),n:+r.n||0,created:+r.created||Date.now()};S.reports.set(rec.id,rec);await Store.put('meta',rec)}
  for(const raw of obj.entries||[]){if(!raw||!raw.id||typeof raw.date!=='string')continue;const e=fixEntry({...raw,id:String(raw.id),title:String(raw.title||''),body:String(raw.body||''),place:String(raw.place||''),tags:(raw.tags||[]).map(String),photos:(raw.photos||[]).map(String),thumbs:Object.fromEntries(Object.entries(raw.thumbs||{}).filter(([,v])=>typeof v==='string'&&v.startsWith('data:image/'))),mood:Number.isInteger(raw.mood)&&raw.mood>=1&&raw.mood<=7?raw.mood:null,fav:!!raw.fav});
    if(!nbById(e.nb))e.nb=S.notebooks[0].id;e.also=e.also.map(String).filter(x=>x!==e.nb&&nbById(x));const i=S.entries.findIndex(x=>x.id===e.id);if(i<0)S.entries.push(e);else S.entries[i]=e;await Store.put('entries',e);n++}
  return n}
async function importFiles(files){
  const nb=$('#impNb')?.value||S.notebooks[0].id,useOcr=$('#impOcr')?.checked;let total=0,fail=0;const before=new Set(S.entries.map(e=>e.id));
  modal(`<h3>正在导入</h3><p class="muted" id="impProg">0 / ${files.length}</p>`);
  for(let i=0;i<files.length;i++){const f=files[i];$('#impProg')&&($('#impProg').textContent=`${i+1} / ${files.length} · ${f.name}`);
    try{
      if(/\.zip$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-zip-compressed'){total+=await importZip(f,nb,useOcr,(t)=>{$('#impProg')&&($('#impProg').textContent=`${i+1} / ${files.length} · ${t}`)})}
      else if(/\.html?$/i.test(f.name)){if(!/^index\.html?$/i.test(f.name)){const it=parseAppleJournal(await f.text(),f.name,new Date(f.lastModified||Date.now()));if(it){const e=fixEntry({id:uid(),nb,...it.entry,created:Date.now(),updated:Date.now()});S.entries.push(e);await Store.put('entries',e);total++}}}
      else if(/\.json$/i.test(f.name)||f.type==='application/json'){const o=JSON.parse(await f.text());total+=await importBackup(o)}

      else{const txt=await f.text();const fd=new Date(f.lastModified||Date.now());const items=splitText(txt,fd.getFullYear(),fd,f.name.replace(/\.[^.]+$/,''));total+=await addImported(items,nb)}
    }catch(err){fail++}}
  closeModal();render();toast(`导入了 ${total} 篇${fail?`，${fail} 个文件/识别失败`:''}`,4000);
  const fresh=S.entries.filter(e=>!before.has(e.id)&&!e.ai).map(e=>e.id);if(fresh.length)setTimeout(()=>offerOrganize(fresh),600);
}

/* ---------- Apple Journal export (ZIP or HTML files from 设置 › App › 日记 › 导出) ---------- */
const MONTHS_EN=['january','february','march','april','may','june','july','august','september','october','november','december'];
function parseAppleDate(t){if(!t)return null;let m;
  if((m=t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/)))return new Date(+m[1],+m[2]-1,+m[3],12,0);
  if((m=t.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/))&&MONTHS_EN.indexOf(m[2].toLowerCase())>=0)return new Date(+m[3],MONTHS_EN.indexOf(m[2].toLowerCase()),+m[1],12,0);
  if((m=t.match(/([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})/))&&MONTHS_EN.indexOf(m[1].toLowerCase())>=0)return new Date(+m[3],MONTHS_EN.indexOf(m[1].toLowerCase()),+m[2],12,0);
  if((m=t.match(/(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/)))return new Date(+m[1],+m[2]-1,+m[3],12,0);
  return null}
function parseAppleJournal(html,name,fallback){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const header=doc.querySelector('.pageHeader')?.textContent.trim();
  const isApple=!!(header||doc.querySelector('.pageContainer,.assetGrid'));
  const d=parseAppleDate(header)||parseAppleDate(name)||fallback;
  const title=(doc.querySelector('.title')?.textContent||'').trim()||(isApple?'':(doc.title||'').trim());
  const prompt=(doc.querySelector('.reflectionPrompt')?.textContent||'').trim();
  let paras=[...doc.querySelectorAll('p:not(.p1), li')].map(p=>(p.tagName==='LI'?'• ':'')+p.textContent.replace(/ /g,' ').trimEnd()).filter((t,i,a)=>t.trim()||i&&a[i-1].trim());
  if(!paras.length){const bt=doc.querySelector('.bodyText')||(!isApple&&doc.body);if(bt)paras=[bt.innerText||bt.textContent||''];}
  let body=(prompt?prompt+'\n\n':'')+paras.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  const tags=[],imgs=[];let place='';
  for(const g of doc.querySelectorAll('.assetGrid .gridItem')){const type=([...g.classList].find(c=>c.startsWith('assetType_'))||'').slice(10).toLowerCase();
    const head=(g.querySelector('.gridItemOverlayHeader')?.textContent||g.querySelector('.gridItemOverlayText,.mediaTitle,.activityType')?.textContent||'').trim();
    const src=g.querySelector('img')?.getAttribute('src');
    if(/photo|image/.test(type)&&src)imgs.push(src);
    else if(/map|location|place/.test(type)&&head&&!place)place=head.slice(0,80);
    else if(/stateofmind/.test(type)&&head)head.split(/[,，、]/).map(x=>x.trim()).filter(Boolean).forEach(t=>tags.push(t.slice(0,30)));
    else if(head&&!/contact/.test(type)&&body.length<20000)body+=`\n\n[${head}]`;}
  if(!body.trim()&&!title&&!imgs.length)return null;
  return{entry:{date:localISO(d),title:title.slice(0,80),body:body.trim(),tags:[...new Set(tags)],place},imgs}}
function zipResolve(base,rel){const parts=base.split('/');parts.pop();for(const seg of decodeURIComponent(rel).split('/')){if(seg==='..')parts.pop();else if(seg&&seg!=='.')parts.push(seg)}return parts.join('/')}
const IMG_RE=/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i;
const mimeOf=n=>({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',heif:'image/heif',bmp:'image/bmp'})[n.split('.').pop().toLowerCase()]||'application/octet-stream';
async function importZip(file,nb,useOcr,progress){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  if(!window.JSZip)throw new Error('解压组件没有加载');
  const zip=await window.JSZip.loadAsync(file);
  const all=Object.values(zip.files).filter(f=>!f.dir&&!/(^|\/)(__MACOSX|\._)/.test(f.name)&&!/(^|\/)\.[^/]*$/.test(f.name));
  const byName=new Map(all.map(f=>[f.name,f]));
  const htmls=all.filter(f=>/\.html?$/i.test(f.name)&&!/(^|\/)index\.html?$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
  let n=0,photoFail=0;
  for(let i=0;i<htmls.length;i++){const f=htmls[i];progress(`日记 ${i+1}/${htmls.length}`);
    const it=parseAppleJournal(await f.async('string'),f.name.split('/').pop(),f.date||new Date());if(!it)continue;
    const e=fixEntry({id:uid(),nb,...it.entry,created:Date.now(),updated:Date.now()});
    for(const src of it.imgs.slice(0,20)){const zf=byName.get(zipResolve(f.name,src));if(!zf)continue;
      try{const blob=new Blob([await zf.async('arraybuffer')],{type:mimeOf(zf.name)});await attachPhoto(e,blob)}catch(err){photoFail++}}
    if(!e.body&&!e.title&&!e.photos.length)continue;
    S.entries.push(e);await Store.put('entries',e);n++}
  for(const f of all.filter(f=>/\.(txt|md|markdown)$/i.test(f.name))){const txt=await f.async('string');const d=f.date||new Date();n+=await addImported(splitText(txt,d.getFullYear(),d,f.name.split('/').pop().replace(/\.[^.]+$/,'')),nb)}
  for(const f of all.filter(f=>/\.json$/i.test(f.name))){try{n+=await importBackup(JSON.parse(await f.async('string')))}catch(err){}}
  if(!htmls.length){const imgs=all.filter(f=>IMG_RE.test(f.name));for(let i=0;i<imgs.length;i++){const f=imgs[i];progress(`照片 ${i+1}/${imgs.length}`);
    try{const blob=new Blob([await f.async('arraybuffer')],{type:mimeOf(f.name)});const e=fixEntry({id:uid(),nb,date:localISO(f.date||new Date()),created:Date.now(),updated:Date.now()});await attachPhoto(e,blob);if(useOcr){try{e.body=await ocr(blob)}catch(err){}}S.entries.push(e);await Store.put('entries',e);n++}catch(err){photoFail++}}}
  if(photoFail)setTimeout(()=>toast(`${photoFail} 张照片没能读取（多半是 HEIC 格式，用 iPhone 的 Safari 导入可以读）`,6000),4200);
  return n}
$('#fileImport').onchange=ev=>{const fs=[...ev.target.files];ev.target.value='';if(fs.length)importFiles(fs)};

/* ---------- export ---------- */
async function saveFile(name,text,type){
  if(caps.dl){try{await caps.dl.save({filename:name,data:new Blob([text],{type})});toast('已导出 '+name);return}catch(e){if(e&&(e.code==='dismissed'||e.code==='cancelled'))return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('已导出 '+name)}catch(e){toast('导出失败')}
}
async function exportJson(){toast('正在打包照片…',10000);const photos=[];
  for(const e of S.entries)for(const p of e.photos){let d=S.photos.get(p);if(!d){try{const o=await Store.get('photos',p);d=o&&o.data}catch(err){}}if(d)photos.push({id:p,data:d})}
  const obj={app:'ego-journal',version:1,exported:new Date().toISOString(),notebooks:S.notebooks,entries:S.entries,photos,reports:[...S.reports.values()]};
  await saveFile(`ego-journal-${dayKey(new Date())}.json`,JSON.stringify(obj),'application/json')}
function exportMd(){const list=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date));
  const md='# Lyra 日记\n\n'+list.map(e=>`## ${e.date.replace('T',' ')}${e.title?' · '+e.title:''}\n\n`+`*${nbById(e.nb)?.name||''}${e.mood?' · '+MOODS[e.mood-1].n:''}${e.place?' · '+e.place:''}${e.tags.length?' · '+e.tags.map(t=>'#'+t).join(' '):''}*\n\n${e.body}\n`).join('\n');
  saveFile(`ego-journal-${dayKey(new Date())}.md`,md,'text/markdown')}



/* ---------- global events ---------- */
document.addEventListener('click',async ev=>{
  if(ev.target.closest('#editor,#modal,#viewer,#auth'))return;
  const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.go){if(d.go==='journal')S.day=null;go(d.go)}
  else if(d.nb){S.nb=d.nb;S.day=null;if(S.view!=='journal')S.view='journal';render()}
  else if(d.calnb){S.nb=d.calnb;render()}
  else if(d.open){if(S.sel){S.sel.has(d.open)?S.sel.delete(d.open):S.sel.add(d.open);b.classList.toggle('picked',S.sel.has(d.open));renderSel();return}const e=S.entries.find(x=>x.id===d.open);if(e)openEditor(e)}
  else if(d.f){S.f[d.f]=!S.f[d.f];render()}
  else if(d.mood){S.f.mood=S.f.mood===d.mood?'':d.mood;render()}
  else if(d.day){S.day=d.day;S.view='journal';render();window.scrollTo(0,0)}
  else if(d.year){S.year=+d.year;render()}
  else if(d.tag){S.q='#'+d.tag;S.view='journal';S.day=null;render()}
  else if(d.nbcolor){const nb=nbById(d.nbcolor);nb.color=d.c;saveNb(nb);render()}
  else if(d.nbdel){delNotebook(d.nbdel)}
  else if(d.nbup){const i=S.notebooks.findIndex(n=>n.id===d.nbup);if(i>0){[S.notebooks[i-1],S.notebooks[i]]=[S.notebooks[i],S.notebooks[i-1]];S.notebooks.forEach((n,j)=>{if(n.order!==j){n.order=j;saveNb(n)}});render()}}
  else if(d.bf||d.hfont||d.fsz){let st=null;try{st=await Store.get('hubMeta','settings')}catch(e){}st=st||{...(HUBST||{}),id:'settings'};if(d.bf)st.bodyFont=d.bf;if(d.hfont)st.headFont=d.hfont;if(d.fsz){st.size=d.fsz;st.zoom={s:92,m:100,l:110}[d.fsz]}let ok=true;try{await Store.put('hubMeta',st)}catch(e){ok=false}if(!ok){Object.assign(S.settings,{bodyFont:st.bodyFont,headFont:st.headFont,size:st.size});Store.put('meta',S.settings).catch(()=>{})}HUBST=st;applyHubTheme(st);render()}
  else if(d.rtype){S.rep.type=d.rtype;render()}
  else if(d.act){const a=d.act;
    if(a==='retryload'&&S.account&&S.key)return enterAccount(S.account,S.key,false);
    if(a==='repprev')return repShift(-1);if(a==='repnext')return repShift(1);if(a==='repgen')return genReport();
    if(a==='aiorg')return aiOrganize(S.entries.filter(e=>!e.ai).map(e=>e.id));
    if(a==='new')newEntry(false);else if(a==='new-prompt')newEntry(true);
    else if(a==='shuffle'){S.prompt=(S.prompt+1)%PROMPTS.length;render()}
    else if(a==='newnb')newNotebook();
    else if(a==='asideoff'){toggleAside(false)}else if(a==='asideon'){toggleAside(true)}
    else if(a==='toggleempty'){try{localStorage.setItem('lyra-empty',localStorage.getItem('lyra-empty')==='1'?'0':'1')}catch(e){}render()}
    else if(a==='selmode'){S.sel=S.sel?null:new Set();render();renderSel()}
    else if(a==='clearday'){S.day=null;render()}
    else if(a==='clearall'){S.q='';S.day=null;S.f={fav:false,photo:false,mood:''};render()}
    else if(a==='import'){S.view='settings';render();setTimeout(()=>$('#fileImport').click(),0)}
    else if(a==='pickimport')$('#fileImport').click();
    else if(a==='paste')pasteImport();
    else if(a==='sfsave'){const v=$('#sfFrom').value;if(!v)return toast('先选一个日期');S.settings.streakFill={from:v,to:dayKey(new Date())};Store.put('meta',S.settings).then(()=>{render();toast(`已连续写了 ${streaks().cur} 天`)},()=>toast('保存失败'))}else if(a==='sfclear'){delete S.settings.streakFill;Store.put('meta',S.settings).catch(()=>{});render()}else if(a==='autosplit')autoSplit();else if(a==='mapimport'){const f=$('#mapFile');f.onchange=async()=>{try{await importMap(JSON.parse(await f.files[0].text()))}catch(err){toast('分区表读不出来')}};f.click()}else if(a==='jbackups')restoreJournal();else if(a==='expjson')exportJson();else if(a==='expmd')exportMd();
    else if(a==='logout')logout();else if(a==='chpw')changePassword();else if(a==='delacc')deleteAccount();
    else if(a==='calprev'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);render()}
    else if(a==='calnext'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);render()}
    else if(a==='caltoday'){S.cal=new Date();render()}
  }
});
$('#fab').onclick=()=>newEntry(false);
let qT=null;
document.addEventListener('input',ev=>{
  if(ev.target.id==='q'){S.q=ev.target.value;clearTimeout(qT);qT=setTimeout(()=>{const tmp=document.createElement('div');tmp.innerHTML=renderJournal();$('.hero')?.remove();if(!tokens().length&&!S.day&&!S.f.fav&&!S.f.photo&&!S.f.mood){const h=tmp.querySelector('.hero');if(h)$('#main').prepend(h)}const nl=tmp.querySelector('.list'),ol=$('#main .list');if(nl&&ol)ol.replaceWith(nl)},200)}
  else if(ev.target.dataset.nbicon){const nb=nbById(ev.target.dataset.nbicon);if(nb){nb.icon=[...ev.target.value.trim()].slice(0,2).join('');saveNb(nb)}}
  else if(ev.target.dataset.nbname){const nb=nbById(ev.target.dataset.nbname);if(nb){nb.name=ev.target.value.slice(0,30)||'未命名';saveNb(nb)}}
});
document.addEventListener('change',ev=>{if(ev.target.dataset.nbname||ev.target.dataset.nbicon)render()});
document.addEventListener('keydown',ev=>{
  if(!ev.metaKey&&!ev.ctrlKey&&!ev.altKey&&$('#editor').hidden&&$('#modal').hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&S.account){
    if(ev.key==='/'){ev.preventDefault();if(S.view!=='journal'){S.view='journal';render()}$('#q')?.focus();return}
    if(ev.key==='n'||ev.key==='N'){ev.preventDefault();newEntry(false);return}}
  if(ev.key==='Enter'&&!ev.isComposing){const t=ev.target;
    if(!$('#modal').hidden&&t.tagName==='INPUT'&&!t.closest('form')){const ok=$('#modalBox [data-a=ok]');if(ok){ev.preventDefault();ok.click();return}}
    if((ev.metaKey||ev.ctrlKey)&&!$('#editor').hidden){ev.preventDefault();closeEditor();toast('已保存');return}}
  if(ev.key==='Escape'){if(!$('#viewer').hidden)$('#viewerX').click();else if(!$('#modal').hidden)closeModal();else if(!$('#editor').hidden)closeEditor()}});
$('#modal').addEventListener('click',ev=>{if(ev.target.id==='modal'&&!$('#impProg')){$('#modalBox').onclick=null;closeModal()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});

init();
}
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});
