<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<title>Lyra</title>
<meta name="description" content="Lyra — 我的终端">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lyra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* VOICE: personal, calm, a bit nerdy — a student's own command centre, sharing the palette of her Nordic trip page
   IDEA: a terminal window on a polar-night desk: one prompt line runs everything, panels around it are the screens it opens
   PICTURE: the top band is the terminal itself beside today's schedule and the trip countdown, under faint snow
   COLOUR and TYPE: slate night ground, snow ink, aurora-teal accent (also all dates), twilight rose, sun gold; Noto Serif SC titles, JetBrains Mono for the prompt, Noto Sans SC elsewhere
   LAYOUT: phone — terminal, today, sites, plans, work stacked; desktop — terminal + today side by side, plans and work in two columns */
:root{color-scheme:dark;--ink2:#c4d0e3;--bf:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--hf:"Noto Serif SC","Songti SC",serif;--bg:#0f1b2d;--bg2:#0b1524;--card:#152439;--card2:#1a2c45;--line:#263b58;--ink:#eef3fa;--mut:#9fb1c9;--acc:#86d9c3;--acc2:#e9b0c2;--sun:#e8c98e;--accInk:#08261b;--warn:#f0b47c;--bad:#f0a0a8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--bf);overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.disp{font-family:var(--hf);font-weight:900;letter-spacing:0;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(24px,4vw,44px) 0;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background-color:var(--bg)}
.band>.wrap{position:relative;z-index:1}
.hello h1,.clock{text-shadow:0 1px 12px rgba(10,20,40,.85)}
.snow{background-image:radial-gradient(circle,#cfe3ff40 1px,transparent 1.5px),radial-gradient(circle,#cfe3ff26 1.3px,transparent 1.8px);background-size:120px 90px,170px 130px;background-position:10px 20px,70px 60px}

.top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hello{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:18px;align-items:end;position:relative}
.hello>*{position:relative;z-index:1}
.hello>.lyra-bg{position:absolute;z-index:0;pointer-events:none;right:124px;top:96px;height:96px;width:auto;opacity:.5}
.lyra-bg .ln{stroke:var(--acc);stroke-opacity:.28;stroke-width:3;fill:none}
.lyra-bg .st circle{fill:#eaf4ff;opacity:.8}
.lyra-bg .st .vega{fill:#fff;opacity:1;animation:tw 4s ease-in-out infinite}
.lyra-bg text{fill:var(--mut);font:600 30px "JetBrains Mono",monospace;letter-spacing:.2em;opacity:.55}
.lyra-bg text.nm{font-size:34px;letter-spacing:.5em;opacity:.35}
@keyframes tw{50%{opacity:.55}}
@media(min-width:900px){.hello>.lyra-bg{right:auto;left:25%;top:-14px;height:calc(100% + 20px);opacity:.9}}
@media(prefers-reduced-motion:reduce){.lyra-bg .st .vega{animation:none}}
.hl{display:flex;flex-direction:column;gap:2px;min-width:0}
.hl-top{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.hello h1{white-space:nowrap;font-size:clamp(22px,4.6vw,30px);line-height:1.15;margin:0;font-weight:700;color:var(--mut)}
.hello h1 i{font-style:normal;color:var(--acc)}
.clock{display:flex;align-items:baseline;gap:4px;line-height:1;margin-top:6px}
.clock b{font-family:var(--hf);font-weight:900;font-size:clamp(40px,9vw,58px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock .colon{color:var(--acc);animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.35}}
.clock .sec{font-size:clamp(14px,2.6vw,17px);color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600;margin-left:4px}
.dateline{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:15px;color:var(--mut);margin-top:8px}
.dateline b{color:var(--ink);font-weight:600}
.sky{background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:9px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:"Inter","Noto Sans SC",system-ui,sans-serif}
.skyh{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.wx .wi{width:40px;height:40px;color:var(--sun)}
.wx .wt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.wx .wt b{font-family:var(--hf);font-size:28px;font-weight:900;line-height:1}
.wx .wt span{font-size:14.5px;color:var(--ink)}
.wx small{display:block;font-size:12px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.sun{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;color:var(--mut)}
.sun b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600;display:block;font-size:13.5px}
.sun .arc{width:100%;height:26px;overflow:visible}
.sunbox{display:grid;gap:6px}
.skys{font-size:12px;color:var(--mut);text-align:center}
.moonrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
.moonrow b{color:var(--ink);font-weight:600}
.moonrow svg{flex:none}
@media(min-width:900px){
  .hello{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);align-items:stretch}.hello.nosky{grid-template-columns:1fr}
  .hl{justify-content:flex-end}
  .sky{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:22px;row-gap:10px;padding:14px 18px}
  .skyh{grid-column:1/-1}
  .sky .wx{grid-column:1;grid-row:2;align-self:center}
  .sky .sunbox{grid-column:2;grid-row:2/4;border-left:1px solid var(--line);padding-left:20px;display:grid;align-content:center;gap:8px}
  .sky .moonrow{grid-column:1;grid-row:3}
  .wx .wi{width:46px;height:46px}.wx .wt b{font-size:32px}
}
@media(max-width:600px){.sky{padding:12px 14px;gap:10px}.wx .wi{width:44px;height:44px}.wx .wt b{font-size:28px}}
@media(prefers-reduced-motion:reduce){.clock .colon{animation:none}}
.term{background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;margin-bottom:16px}
.term .out{grid-column:1/-1;border-bottom:1px solid var(--line)}
.term .out:empty{display:none}
.term .bar{display:none;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.term .bar i{width:11px;height:11px;border-radius:50%;display:block}
.term .bar span{margin-left:8px;font-size:12.5px;color:var(--mut)}
.out{padding:10px 16px;max-height:200px;overflow-y:auto;font-size:14px;line-height:1.7}
.out p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.out .cmd{color:var(--mut)}
.out .ok{color:var(--acc)}
.out .err{color:var(--bad)}
.out a{color:var(--acc);text-underline-offset:3px}
.prompt{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;font-size:14px}
.prompt label{color:var(--acc);white-space:nowrap}
.prompt input{flex:1;background:none;border:0;outline:none;font:inherit;font-size:15px;min-height:44px;caret-color:var(--acc)}
.hint{font-size:12px;color:var(--mut);padding:0 10px;display:flex;gap:6px}
@media(max-width:600px){.hint{display:none}}
.hint button{border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mut)}
.hint button:hover{color:var(--acc);border-color:var(--acc)}
.side{display:grid;gap:12px}
@media(min-width:900px){.side{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
  .side{align-items:stretch}
  #today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  #today .cls{display:block;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:color-mix(in srgb,var(--bg2) 50%,transparent)}
  #today .cls .t{display:block;font-size:12.5px}#today .cls b{display:block;font-size:13.5px;line-height:1.35;margin:2px 0}#today .cls small{display:block}
  .trip{padding:14px 18px;display:flex;flex-direction:column}.trip h2{margin-bottom:auto}.trip .big{font-size:46px;margin-top:10px}.trip::after{width:120px;height:80px}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile h2{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cls{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.cls:first-of-type{border-top:0}
.cls .t{color:var(--acc);white-space:nowrap}
.cls b{font-weight:600}
.cls small{grid-column:2;color:var(--mut);font-size:12.5px}
.cls.now .t,.cls.now b{color:var(--acc)}
.cls.past{opacity:.45}
.trip{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card2)),var(--card) 60%,var(--card2));position:relative;overflow:hidden}
.trip::after{content:"";position:absolute;inset:auto -30px -50px auto;width:170px;height:120px;background:radial-gradient(closest-side,rgba(134,217,195,.32),transparent);filter:blur(4px)}
.trip .big{font-size:clamp(40px,9vw,54px);line-height:1;font-family:var(--hf);color:var(--acc)}
.trip .big small{font-size:16px;color:var(--ink);font-family:"Noto Sans SC",sans-serif;margin-left:6px}
.trip p{margin:6px 0 0;font-size:13.5px;color:var(--ink2);position:relative}
.trip a{color:var(--acc)}
section.s{padding:30px 0 6px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{font-size:28px;margin:0}
.sh h2 small{font-family:"Noto Sans SC",sans-serif;font-size:14px;color:var(--mut);margin-left:8px}
.btn{height:40px;padding:0 15px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.danger{color:var(--bad);border:1px solid rgba(240,160,168,.5)}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.site{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;min-height:76px;transition:border-color .15s,transform .15s}
.site:hover{border-color:var(--c);transform:translateY(-2px)}
.site{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.site.dragging{opacity:.25;border-style:dashed}
.dhint{font:400 12.5px "Noto Sans SC",sans-serif;color:var(--mut);margin-left:10px}
@media(hover:none){.dhint::after{content:"（长按）"}}
.apps{display:flex;flex-wrap:wrap;gap:6px}.apps button{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line);font-size:13px;color:var(--mut)}.apps button:hover{color:var(--acc);border-color:var(--acc)}
.apptag{font-style:normal;font-size:10.5px;letter-spacing:.06em;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:auto;align-self:center}
.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;box-shadow:0 18px 40px rgba(0,0,0,.45);border-color:var(--c);transform:rotate(-2deg) scale(1.04);opacity:.95}
.sites.reordering .site:not(.dragging){transition:transform .15s}
.site .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.icpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.icpick button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut)}.icpick button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tilebtn{color:var(--acc);font-size:13px;font-weight:500}
.tt-day{margin:14px 0 4px;font-weight:700;color:var(--acc);font-size:14px}
.box.wide{max-width:640px}
.site b{display:block;font-size:15.5px;line-height:1.3}
.site span{font-size:12.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .ed{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--card2);display:none;place-items:center;font-size:13px}
.editing .site .ed{display:grid}
.lower{display:grid;grid-template-columns:minmax(0,1fr);column-gap:26px}
.modoff{display:none!important}
body.light{color-scheme:light}body.light *{text-shadow:none!important}
body.light .crs,body.light .gcode,body.light .cls .dot{filter:brightness(.62) saturate(1.4)}
body.light .snow{background-image:radial-gradient(circle,#3a4a6630 1px,transparent 1.5px),radial-gradient(circle,#3a4a661c 1.3px,transparent 1.8px)}
body.light input[type=date]::-webkit-calendar-picker-indicator,body.light input[type=time]::-webkit-calendar-picker-indicator,body.light input[type=datetime-local]::-webkit-calendar-picker-indicator{filter:none}
body.light .ctx,body.light .box,body.light .card,body.light .tile,body.light .sky,body.light .gcard{box-shadow:0 1px 3px rgba(40,50,80,.08)}
.skyc{display:inline-flex;gap:2px;margin:-4px -6px -4px 0}
.skyc button{width:24px;height:24px;border-radius:7px;color:var(--mut);font-size:13px;line-height:1;opacity:.55;letter-spacing:0}
.sky:hover .skyc button,.skyc button:focus-visible{opacity:1}.skyc button:hover{background:var(--card2);color:var(--acc)}
@media(hover:none){.skyc button{opacity:.8}}
.skyshow{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);font-size:13px}
.skyshow[hidden]{display:none}.skyshow .wi{width:18px;height:18px;color:var(--sun)}
.cbg{position:relative;cursor:pointer}.cbg input{width:18px;height:18px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
body.nostars .snow{background-image:none}
body.bggrad{background:linear-gradient(165deg,var(--bg) 0%,var(--bg) 35%,var(--bgG) 100%) fixed}
body.bggrad .band{background-color:transparent}
.ctx{position:fixed;z-index:90;min-width:188px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:ctxin .12s ease-out}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink)}
.ctx button:hover,.ctx button:focus{background:color-mix(in srgb,var(--acc) 16%,transparent);outline:none}
.ctx button.danger{color:var(--bad)}.ctx .ci{width:18px;display:inline-grid;place-items:center;text-align:center;color:var(--mut);font-size:13px}.ctx button.danger .ci{color:var(--bad)}
.ctx kbd{margin-left:auto;font:11px "JetBrains Mono",monospace;color:var(--mut)}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
@keyframes ctxin{from{opacity:0;transform:scale(.97)}}
@keyframes vin{from{opacity:0;transform:translateY(4px)}}
#main>*,#lower>section,.modal .box{animation:vin .18s ease-out}
@media(prefers-reduced-motion:reduce){#main>*,#lower>section,.modal .box,.ctx{animation:none}}
.wk,.todo{-webkit-touch-callout:none}
.hl{position:relative}
.skymini{display:none}
@media(max-width:899px){
  .skymini{display:grid;grid-template-columns:auto auto;gap:2px 8px;align-items:center;position:absolute;right:0;top:58px;padding:8px 10px;border-radius:16px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line);text-align:left;color:var(--ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .skymini .wi{width:30px;height:30px;color:var(--sun);grid-row:span 1}
  .skymini .smt b{font-family:var(--hf);font-size:24px;font-weight:900;line-height:1;display:block}
  .skymini .smt small{font-size:11px;color:var(--mut);display:block;margin-top:2px}
  .skymini .sms{grid-column:1/-1;font-size:10.5px;color:var(--mut);line-height:1.45;font-variant-numeric:tabular-nums}
  .hello>.sky{display:none}.hello>.sky.open{display:grid}
  .hello.nosky .skymini{display:none}
}
.top.noterm{grid-template-columns:1fr!important}.top.noside .side{display:none}
.hl-r{display:flex;gap:6px;align-items:center;flex:none}
.gear{width:36px;height:36px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);display:grid;place-items:center;color:var(--mut)}
.gear svg{width:18px;height:18px}
.sync{font-size:12px;color:var(--mut);display:inline-flex;align-items:center;gap:6px;padding:0 4px;height:36px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.sync.busy::before{background:var(--sun);animation:blink 1s steps(1) infinite}.sync.warn::before{background:var(--warn)}.sync.bad{color:var(--bad)}.sync.bad::before{background:var(--bad)}
@media(max-width:600px){.sync{font-size:11px;max-width:96px;overflow:hidden;text-overflow:ellipsis;padding:0}.hl-r{gap:4px}.acct{padding:0 10px}}
.setg{border-top:1px solid var(--line);padding:14px 0 6px}.setg h4{margin:0 0 8px;font-size:14px}
.sethint{color:var(--mut);font-size:13px;margin:0 0 10px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.chip .dot{width:12px;height:12px;border-radius:50%}
.sw2{display:flex;flex-wrap:wrap;gap:10px}
.sw2 button,.sw2 .cust{display:grid;justify-items:center;gap:4px;font-size:11.5px;color:var(--mut);cursor:pointer}
.sw2 i{width:34px;height:34px;border-radius:50%;background:var(--c);display:block;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw2 button[aria-pressed=true] i{border-color:var(--ink)}
.sw2 input[type=color]{width:34px;height:34px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14.5px}
.mrow label{display:flex;gap:8px;align-items:center;cursor:pointer}
.mrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.msep{border-top:1px dashed var(--line);margin:6px 0}
.ib2{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);color:var(--mut);font-size:13px;display:inline-grid;place-items:center;margin-left:4px}
.ib2:disabled{opacity:.3;cursor:default}
.locr{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:10px;background:var(--bg2);margin-bottom:6px;font-size:14.5px}.locr span{color:var(--mut);font-size:13px}
#locR{margin:8px 0}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:12px 14px}
.gh{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.gcode{font-family:var(--hf);font-weight:900;font-size:19px!important;border:0!important;background:none!important;padding:0!important;min-height:32px!important;color:var(--c)!important}
.gp{display:grid;grid-template-columns:minmax(0,1fr) 72px 78px 32px;gap:6px;align-items:center;margin-bottom:6px}

  base,chain:new Map(),async open(){return this},

    for(let i=0;i<2000;i++){let q=this.col(k);if(last)q=q.where('id','>',last);let snap=null,err=null;
      for(let t=0;t<4&&!snap;t++){try{snap=await q.orderBy('id').limit(P).get()}catch(e){err=e;if(e&&(e.code==='revoked'||e.code==='invalid_argument'))break;await new Promise(r=>setTimeout(r,700*(t+1)))}}
      if(!snap)throw err||new Error('load failed');
      snap.docs.forEach(d=>{if(d.exists)out.push(structuredClone(d.data()))});if(prog)prog(out.length);
      if(snap.size<P)break;last=snap.docs[snap.docs.length-1].id}

  async get(k,id){const d=await this.col(k).doc(id).get();return d.exists?structuredClone(d.data()):null},
  q(key,fn){const p=(this.chain.get(key)||Promise.resolve()).catch(()=>{}).then(fn);this.chain.set(key,p);return p},

/* ---------- encryption (AES-GCM 256, key wrapped by PBKDF2-SHA256 of the password) ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=buf=>{const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ITER=310000;
async function deriveKek(pw,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),ct:b64(ct)}}
async function open_(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct)))}
const importDataKey=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
function makeEncrypted(raw,key){return{
  raw,
  async dec(r){try{return JSON.parse(TD.decode(await open_(key,r)))}catch(e){return null}},
  async all(k,prog){const rows=await raw.all(k,prog);const out=(await Promise.all(rows.map(r=>this.dec(r)))).filter(Boolean);if(rows.length&&!out.length)throw new Error('decrypt');return out},
  async get(k,id){const r=await raw.get(k,id);return r?this.dec(r):null},
  async put(k,o){const e=await seal(key,TE.encode(JSON.stringify(o)));return raw.put(k,{id:o.id,v:1,...e})},
  del(k,id){return raw.del(k,id)}
}}

const SY={pending:0,last:null,err:false,retry:[]};
function track(fn){SY.pending++;renderSync();return fn().then(r=>{SY.last=Date.now();SY.err=false;return r},e=>{SY.err=true;SY.retry.push(fn);throw e}).finally(()=>{SY.pending--;renderSync()})}

function renderSync(){const el=$('#sync');if(!el)return;const local=S.mode==='local'||S.mode==='memory';
  let t,c='';if(!navigator.onLine||OFFLINE){t='离线 · 联网后自动同步';c='warn'}else if(SY.err){t='同步失败 · 点这里重试';c='bad'}else if(SY.pending){t='同步中…';c='busy'}
  else t=local?'只存在这台设备':`已同步${SY.last?' · '+new Date(SY.last).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}`;
  el.className='sync '+c;el.textContent=t;el.title=S.mode==='supa'?'云端（Supabase），内容加密':S.mode==='cloud'?'Claude 账户里的私人数据库，内容加密':'只保存在这个浏览器'}

  const kinds=Object.fromEntries(Object.entries(HK).map(([k,v])=>[v,k]));
  RT=sb.channel('lyra-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'records',filter:'user_id=eq.'+uid},async p=>{
      const row=p.eventType==='DELETE'?p.old:p.new;const k=kinds[row&&row.kind];if(!k)return;
      if(k==='meta'&&row.id==='settings'&&Date.now()-(saveSettings.at||0)<4000)return;

function calc(parts){let wk=0,got=0,wu=0;for(const p of parts){const w=+p.w||0;if(p.s!==''&&p.s!=null&&!isNaN(+p.s)){wk+=w;got+=w*(+p.s)/100}else wu+=w}return{wk,got,wu,avg:wk?got/wk*100:null}}

function sunTimes(day,lat,lng){const rad=Math.PI/180;const d=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),12);const J=d/864e5+2440587.5;const nn=Math.round(J-2451545+0.0008);const Js=nn-lng/360;
  const M=(357.5291+0.98560028*Js)%360,C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad),L=(M+C+180+102.9372)%360;
  const Jt=2451545+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad),dec=Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const cw=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));if(cw>1)return{polar:'night'};if(cw<-1)return{polar:'day'};
  const w=Math.acos(cw)/rad,T=j=>new Date((j-2440587.5)*864e5);return{rise:T(Jt-w/360),set:T(Jt+w/360)}}
function moonInfo(now){const syn=29.530588853,age=(((now-Date.UTC(2000,0,6,18,14))/864e5)%syn+syn)%syn,p=age/syn,illum=(1-Math.cos(2*Math.PI*p))/2;
  const name=p<.03||p>.97?'New Moon':p<.22?'Waxing Crescent':p<.28?'First Quarter':p<.47?'Waxing Gibbous':p<.53?'Full Moon':p<.72?'Waning Gibbous':p<.78?'Last Quarter':'Waning Crescent';
  const toFull=Math.round(((.5-p+1)%1)*syn),toNew=Math.round(((1-p)%1)*syn);return{p,illum,name,toFull,toNew}}

function parseDue(text){
  const n=new Date();let due=null,t=text;
  const set=d=>{due=dk(d)};
  const rel={'今天':0,'今晚':0,'明天':1,'后天':2,'大后天':3};
  for(const [k,v] of Object.entries(rel)){const re=new RegExp('(^|\\s)'+k+'(\\s|$)');if(re.test(t)){const d=new Date(n);d.setDate(d.getDate()+v);set(d);t=t.replace(re,' ');break}}
  let m;
  if(!due&&(m=t.match(/(^|\s)(下)?(周|星期)([一二三四五六日天])(\s|$)/))){const target='日一二三四五六'.indexOf(m[4]==='天'?'日':m[4]);const d=new Date(n);let diff=(target-d.getDay()+7)%7;if(m[2])diff+=7;else if(diff===0)diff=7;d.setDate(d.getDate()+diff);set(d);t=t.replace(m[0],' ')}
  if(!due&&(m=t.match(/(^|\s)(\d{1,2})[\/.月](\d{1,2})日?(\s|$)/))){let d=new Date(n.getFullYear(),+m[2]-1,+m[3]);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()-30))d.setFullYear(d.getFullYear()+1);set(d);t=t.replace(m[0],' ')}
  return{text:t.replace(/\s+/g,' ').trim(),due}}
function dueLabel(due){if(!due)return{t:'',c:''};const t0=pd(dk(new Date())),d=pd(due),x=Math.round((d-t0)/864e5);
  return{t:x===0?'今天':x===1?'明天':x===-1?'昨天':x<0?`过期 ${-x} 天`:x<7?`周${WD[d.getDay()]}`:`${d.getMonth()+1}/${d.getDate()}`,c:x<0?'late':x<=1?'soon':''}}
function addPlan(raw){const {text,due}=parseDue(raw);if(!text)return null;const p={id:uid(),text:text.slice(0,200),due,done:false,created:Date.now()};S.plans.push(p);DB.put('plans',p);renderPlans();return p}
function renderPlans(){
  const today=dk(new Date());const open=S.plans.filter(p=>!p.done),done=S.plans.filter(p=>p.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const g1=open.filter(p=>p.due&&p.due<=today).sort((a,b)=>a.due.localeCompare(b.due)),g2=open.filter(p=>p.due&&p.due>today).sort((a,b)=>a.due.localeCompare(b.due)),g3=open.filter(p=>!p.due).sort((a,b)=>a.created-b.created);
  const row=p=>{const d=dueLabel(p.due);return `<div class="todo ${p.done?'done':''}"><button class="chk" data-chk="${esc(p.id)}" aria-pressed="${p.done}" aria-label="完成"><i>${p.done?'✓':''}</i></button><button class="tx" data-editplan="${esc(p.id)}">${esc(p.text)}</button><span class="due ${d.c}">${d.t}</span></div>`};
  const grp=(n,l)=>l.length?`<div class="grp">${n} · ${l.length}</div>${l.map(row).join('')}`:'';
  $('#planCount').textContent=open.length?`${open.length} 件待办`:'';
  $('#plans').innerHTML=(open.length?grp('今天 / 已到期',g1)+grp('接下来',g2)+grp('没有日期',g3):'<div class="empty">没有待办</div>')+
   (done.length?`<div class="grp"><button data-act="togdone" style="color:var(--mut)">${S.showDone?'收起':'显示'}已完成 · ${done.length}</button></div>${S.showDone?done.slice(0,50).map(row).join(''):''}`:'');
}

let INBOX=null;S.inbox=[];
const nk=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const dupDDL=x=>S.work.some(w=>w.date===x.date&&(nk(w.task)===nk(x.task)||nk(w.task).includes(nk(x.task))||nk(x.task).includes(nk(w.task))));
async function loadInbox(){if(S.mode==='supa'&&sb){try{const r=await sb.from('inbox').select('id,data,created_at').eq('status','new').order('created_at').limit(200);if(r.error)throw r.error;

/* ---------- right-click / long-press menu ---------- */
function ctxMenu(x,y,items){ctxClose();const m=document.createElement('div');m.className='ctx';m.setAttribute('role','menu');
  m.innerHTML=items.map((it,i)=>it==='-'?'<hr>':`<button role="menuitem" data-ci="${i}" class="${it.danger?'danger':''}">${it.icon?`<span class="ci">${it.icon}</span>`:''}${it.label}${it.hint?`<kbd>${it.hint}</kbd>`:''}</button>`).join('');
  document.body.appendChild(m);const r=m.getBoundingClientRect();m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';
  m.addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(!b)return;const it=items[+b.dataset.ci];ctxClose();it.act&&it.act()});
  m.querySelector('button')?.focus({preventScroll:true});
  m.addEventListener('keydown',e=>{const bs=[...m.querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus()}})}
function ctxClose(){document.querySelectorAll('.ctx').forEach(x=>x.remove())}
addEventListener('pointerdown',e=>{if(!e.target.closest('.ctx'))ctxClose()},true);addEventListener('scroll',ctxClose,true);addEventListener('resize',ctxClose);
addEventListener('keydown',e=>{if(e.key==='Escape')ctxClose()});
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||'已复制')}catch(e){toast('复制不了')}}
/* long press (touch) opens the same menu */
function onLongPress(root,sel,fn){let T=null,sx=0,sy=0;root.addEventListener('touchstart',e=>{const el=e.target.closest(sel);if(!el)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;T=setTimeout(()=>{T=null;LP=Date.now();try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}fn(el,sx,sy)},480)},{passive:true});
  root.addEventListener('touchmove',e=>{if(!T)return;const t=e.touches[0];if(Math.hypot(t.clientX-sx,t.clientY-sy)>8){clearTimeout(T);T=null}},{passive:true});
  root.addEventListener('touchend',()=>{clearTimeout(T);T=null})}
let LP=0;document.addEventListener('click',e=>{if(Date.now()-LP<600){e.preventDefault();e.stopPropagation()}},true);

const ICN={edit:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19H5v-4z"/></svg>',open:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>',tab:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="13" height="13" rx="2"/><path d="M8 4h12v12"/></svg>',copy:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5H4v12h4"/></svg>',del:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',done:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',undo:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4.5 11.5 9 16"/><path d="M4.5 11.5H15a4.5 4.5 0 0 1 0 9h-3"/></svg>',up:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',hide:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.2A9.6 9.6 0 0 1 12 6c5 0 8.5 4.5 9 6-.3.9-1.3 2.4-2.9 3.8M6.5 7.6C4.6 8.9 3.4 10.7 3 12c.5 1.5 4 6 9 6 1.4 0 2.7-.3 3.8-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/></svg>',set:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>',add:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>'};
function siteMenu(x,cx,cy){const u=siteUrl(x.url);ctxMenu(cx,cy,[
  u&&{icon:ICN.open,label:'打开',act:()=>{location.href=u}},
  u&&safeUrl(u)&&{icon:ICN.tab,label:'在新标签页打开',act:()=>open(u,'_blank','noopener')},
  {icon:ICN.edit,label:'编辑',act:()=>siteModal(x)},
  u&&{icon:ICN.copy,label:'复制链接',act:()=>copyText(u,'链接已复制')},
  {icon:ICN.up,label:'移到最前',act:()=>{const L=[...S.sites].sort((a,b)=>(a.order??0)-(b.order??0)).filter(y=>y!==x);[x,...L].forEach((y,i)=>{if(y.order!==i){y.order=i;DB.put('sites',y)}});renderSites()}},
  '-',{icon:ICN.del,label:'删除',danger:true,act:()=>delUndo('sites',x,x.name)}].filter(Boolean))}
function workMenu(w,cx,cy){const f=isFin(w);ctxMenu(cx,cy,[
  {icon:f?ICN.undo:ICN.done,label:f?'标记为未完成':'标记为完成',act:()=>setDone(w,!f)},
  {icon:ICN.edit,label:'编辑',act:()=>workModal(w)},
  {icon:ICN.copy,label:'复制',act:()=>copyText(`${w.course} ${w.task}${w.date?' · '+w.date+(w.time?' '+w.time:''):''}`)},
  {icon:ICN.add,label:'复制成新的 DDL',act:()=>{const it={...structuredClone(w),id:uid(),status:S0};S.work.push(it);DB.put('work',it);renderWork();workModal(it)}},
  '-',{icon:ICN.del,label:'删除',danger:true,act:()=>delUndo('work',w,w.task)}])}
function planMenu(p,cx,cy){ctxMenu(cx,cy,[
  {icon:p.done?ICN.undo:ICN.done,label:p.done?'标记为未完成':'完成',act:()=>{p.done=!p.done;p.doneAt=Date.now();DB.put('plans',p);renderPlans()}},
  {icon:ICN.edit,label:'编辑',act:()=>planModal(p)},
  {icon:ICN.copy,label:'复制文字',act:()=>copyText(p.text)},
  '-',{icon:ICN.del,label:'删除',danger:true,act:()=>delUndo('plans',p,p.text)}])}
function moduleMenu(key,cx,cy){ctxMenu(cx,cy,[{icon:ICN.hide,label:'隐藏这个模块',act:()=>{SET.hidden=[...new Set([...(SET.hidden||[]),key])];saveSettings();toast('已隐藏，可以在 ⚙ 设置 › 模块 里打开')}},{icon:ICN.set,label:'设置…',act:settingsModal}])}
const MODKEY=[['#sky,#skymini','sky'],['#mod-terminal','terminal'],['#mod-today','today'],['#trip','trip'],['#plans-s','plans'],['#work-s','work'],['#grades-s','grades'],['#sites-s','sites']];
function ctxFor(t,cx,cy){
  const a=t.closest('a.site');if(a){const x=S.sites.find(y=>y.id===a.dataset.site);if(x){siteMenu(x,cx,cy);return true}}
  const wk=t.closest('.wk');if(wk){const id=wk.querySelector('[data-wdone]')?.dataset.wdone,w=S.work.find(y=>y.id===id);if(w){workMenu(w,cx,cy);return true}}
  const td=t.closest('.todo');if(td){const id=td.querySelector('[data-chk]')?.dataset.chk,p=S.plans.find(y=>y.id===id);if(p){planMenu(p,cx,cy);return true}}
  if(t.closest('input,textarea,.ctx,#box'))return false;
  for(const [sel,key] of MODKEY)if(t.closest(sel)){moduleMenu(key,cx,cy);return true}
  return false}
document.addEventListener('contextmenu',e=>{if(!S.ready||e.shiftKey)return;if(e.pointerType==='touch'&&e.target.closest('a.site')){e.preventDefault();return}if(ctxFor(e.target,e.clientX,e.clientY))e.preventDefault()});
onLongPress(document,'.wk,.todo',(el,x,y)=>ctxFor(el,x,y));
/* delete right away, offer undo instead of asking first */
const RR={sites:()=>renderSites(),plans:()=>renderPlans(),work:()=>renderWork()};
function delUndo(kind,it,label){S[kind]=S[kind].filter(y=>y!==it);DB.del(kind,it.id);RR[kind]();toast(`已删除${label?'：'+label:''}`,{label:'撤销',fn:()=>{if(!S[kind].includes(it))S[kind].push(it);DB.put(kind,it);RR[kind]()}})}
function renderAll(){renderToday();renderSites();renderPlans();renderWork();renderGrades();renderInbox()}
$('#grades').addEventListener('input',gradesEvent);
$('#grades').addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;e.preventDefault();const L=[...document.querySelectorAll('#grades input')];const n=L[L.indexOf(e.target)+1];if(n){n.focus();n.select&&n.select()}else e.target.blur()});
if(!window.__LT)applySettings();tick();renderSky();loadWeather();
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
}
</script>
