<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>Lyra 的终端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* VOICE: personal, calm, a bit nerdy — a student's own command centre, sharing the palette of her Nordic trip page
   IDEA: a terminal window on a polar-night desk: one prompt line runs everything, panels around it are the screens it opens
   PICTURE: the top band is the terminal itself beside today's schedule and the trip countdown, under faint snow
   COLOUR and TYPE: slate night ground, snow ink, aurora-teal accent (also all dates), twilight rose, sun gold; Noto Serif SC titles, JetBrains Mono for the prompt, Noto Sans SC elsewhere
   LAYOUT: phone — terminal, today, sites, plans, work stacked; desktop — terminal + today side by side, plans and work in two columns */
:root{color-scheme:dark;--bg:#0f1b2d;--bg2:#0b1524;--card:#152439;--card2:#1a2c45;--line:#263b58;--ink:#eef3fa;--mut:#9fb1c9;--acc:#86d9c3;--acc2:#e9b0c2;--sun:#e8c98e;--accInk:#08261b;--warn:#f0b47c;--bad:#f0a0a8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"PingFang SC",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.disp{font-family:"Noto Serif SC","Songti SC",serif;font-weight:900;letter-spacing:0;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(24px,4vw,44px) 0;position:relative;overflow:hidden;border-bottom:1px solid var(--line);background-color:var(--bg)}
.band>.wrap{position:relative;z-index:1}
.hello h1,.clock{text-shadow:0 1px 12px rgba(10,20,40,.85)}
.snow{background-image:radial-gradient(circle,#cfe3ff40 1px,transparent 1.5px),radial-gradient(circle,#cfe3ff26 1.3px,transparent 1.8px);background-size:120px 90px,170px 130px;background-position:10px 20px,70px 60px}

.top{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hello h1{font-size:clamp(32px,7vw,50px);line-height:1.05;margin:0}
.hello h1 i{font-style:normal;color:var(--acc)}
.clock{font-size:15px;color:var(--mut);text-align:right}
.clock b{display:block;font-size:clamp(24px,5vw,32px);color:var(--ink);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.term{background:rgba(11,21,36,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.term .bar{display:flex;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.term .bar i{width:11px;height:11px;border-radius:50%;display:block}
.term .bar span{margin-left:8px;font-size:12.5px;color:var(--mut)}
.out{padding:12px 16px 4px;min-height:96px;max-height:260px;overflow-y:auto;font-size:14px;line-height:1.7}
.out p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.out .cmd{color:var(--mut)}
.out .ok{color:var(--acc)}
.out .err{color:var(--bad)}
.out a{color:var(--acc);text-underline-offset:3px}
.prompt{display:flex;align-items:center;gap:8px;padding:6px 16px 14px;font-size:15px}
.prompt label{color:var(--acc);white-space:nowrap}
.prompt input{flex:1;background:none;border:0;outline:none;font:inherit;font-size:16px;min-height:40px;caret-color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap}
.hint button{border:1px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mut)}
.hint button:hover{color:var(--acc);border-color:var(--acc)}
.side{display:grid;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile h2{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.cls{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.cls:first-of-type{border-top:0}
.cls .t{color:var(--acc);white-space:nowrap}
.cls b{font-weight:600}
.cls small{grid-column:2;color:var(--mut);font-size:12.5px}
.cls.now .t,.cls.now b{color:var(--acc)}
.cls.past{opacity:.45}
.trip{background:linear-gradient(135deg,#1a3350,#152439 60%,#1a2c45);position:relative;overflow:hidden}
.trip::after{content:"";position:absolute;inset:auto -30px -50px auto;width:170px;height:120px;background:radial-gradient(closest-side,rgba(134,217,195,.32),transparent);filter:blur(4px)}
.trip .big{font-size:clamp(40px,9vw,54px);line-height:1;font-family:"Noto Serif SC",serif;color:var(--acc)}
.trip .big small{font-size:16px;color:var(--ink);font-family:"Noto Sans SC",sans-serif;margin-left:6px}
.trip p{margin:6px 0 0;font-size:13.5px;color:#c6d3ea;position:relative}
.trip a{color:var(--acc)}
section.s{padding:30px 0 6px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sh h2{font-size:28px;margin:0}
.sh h2 small{font-family:"Noto Sans SC",sans-serif;font-size:14px;color:var(--mut);margin-left:8px}
.btn{height:40px;padding:0 15px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.btn.pri{background:var(--acc);color:var(--accInk)}
.btn.line{border:1px solid var(--line);background:var(--card)}
.btn.danger{color:var(--bad);border:1px solid rgba(240,160,168,.5)}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.site{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;min-height:76px;transition:border-color .15s,transform .15s}
.site:hover{border-color:var(--c);transform:translateY(-2px)}
.site .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.icpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.icpick button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut)}.icpick button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.tilebtn{color:var(--acc);font-size:13px;font-weight:500}
.tt-day{margin:14px 0 4px;font-weight:700;color:var(--acc);font-size:14px}
.box.wide{max-width:640px}
.site b{display:block;font-size:15.5px;line-height:1.3}
.site span{font-size:12.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .ed{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--card2);display:none;place-items:center;font-size:13px}
.editing .site .ed{display:grid}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input{flex:1}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:9px 12px;font-size:16px;min-height:44px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.grp{font-size:13px;color:var(--mut);margin:16px 0 6px;font-weight:600;display:flex;gap:10px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.todo{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;padding:4px 6px 4px 0;border-radius:12px}
.todo:hover{background:var(--card)}
.chk{width:44px;height:44px;display:grid;place-items:center}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--accInk)}
.chk[aria-pressed=true] i{background:var(--acc);border-color:var(--acc)}
.todo .tx{text-align:left;padding:8px 0;font-size:15.5px}
.todo.done .tx{color:var(--mut);text-decoration:line-through}
.due{font-size:12.5px;color:var(--mut);white-space:nowrap;padding:0 6px}
.due.late{color:var(--bad)}.due.soon{color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--card)}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.wk{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden;text-align:left;width:100%}
.wk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.wk .dd{text-align:center;line-height:1.15}
.wk .dd b{display:block;font-size:20px;font-family:"Noto Serif SC",serif;font-weight:400}
.wk .dd span{font-size:11.5px;color:var(--mut)}
.wk .dd b{color:var(--acc)}
.wk .m{font-size:12.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.wk .tt{font-weight:600;font-size:15px;line-height:1.35}
.pill{padding:1px 8px;border-radius:9px;font-weight:600;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 75%,#fff);font-size:12px}
.st{height:30px;padding:0 10px;border-radius:15px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.st.s0{color:var(--bad);border-color:rgba(240,160,168,.45)}
.st.s1{color:#8fb8f0;border-color:rgba(143,184,240,.45)}
.st.s2{color:var(--acc);border-color:rgba(134,217,195,.45)}
.st.s3{color:var(--warn);border-color:rgba(240,180,124,.45)}
.wk.fin{opacity:.55}
.empty{color:var(--mut);font-size:14px;padding:14px 0}
.modal{position:fixed;inset:0;background:rgba(3,8,20,.72);z-index:60;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:460px;width:100%;max-height:88vh;overflow:auto}
.box h3{margin:0 0 10px;font-size:19px}
.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}
.field label{font-size:13.5px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.row .sp{margin-right:auto}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.sw button[aria-pressed=true]{border-color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;font-weight:500;max-width:90vw}
.toast[hidden]{display:none}
.lock{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:max(10vh,24px) 20px 20px;overflow-y:auto}
.lock[hidden]{display:none}
.auth{width:100%;max-width:380px;display:flex;flex-direction:column;position:relative;z-index:1}
.auth label{font-size:14px;color:var(--mut);margin:12px 0 6px}
.auth .remember{display:flex;align-items:center;gap:10px;margin:14px 0 0;color:var(--ink);font-size:15px}
.auth .remember input{width:20px;height:20px;accent-color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{height:40px;border-radius:9px;color:var(--mut);font-weight:600}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accInk)}
.warn{font-size:13px;background:rgba(240,180,124,.12);border:1px solid rgba(240,180,124,.35);border-radius:10px;padding:10px 12px;margin:14px 0 0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.acct{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:rgba(21,36,57,.8);font-size:13.5px;color:var(--mut);margin-top:8px}
.acct:hover{color:var(--acc);border-color:var(--acc)}
[hidden]{display:none!important}
.site{min-height:64px;padding:12px 14px}
.site b{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.next .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--mut)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;border-radius:18px;margin:4px 0 16px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card) 70%)}
.next .lab{font-size:12px;font-weight:700;color:var(--c);letter-spacing:.06em}
.next .nt{font-size:18px;font-weight:700;line-height:1.35;margin:2px 0 6px}
.next .nn{font-size:13px;color:var(--mut);margin-top:6px}
.next .nr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.next .nr b{font-family:"Noto Serif SC",serif;font-size:clamp(26px,6vw,34px);font-weight:900;color:var(--acc);line-height:1;white-space:nowrap}
.next .nr span{font-size:12px;color:var(--mut)}
.next .nr .btn{margin-top:8px;height:36px}
.mon{display:grid;grid-template-columns:auto auto minmax(40px,1fr);gap:10px;align-items:center;margin:20px 0 8px}
.mon b{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:900}
.mon span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.mon i{height:4px;border-radius:2px;background:var(--card2);overflow:hidden;display:block}.mon i em{display:block;height:100%;background:var(--acc)}
.wk{grid-template-columns:44px minmax(0,1fr);gap:2px;padding:6px 10px 6px 4px}
.wchk{width:44px;height:44px;display:grid;place-items:center}
.wchk i{width:22px;height:22px;border-radius:7px;border:2px solid color-mix(in srgb,var(--c) 70%,var(--mut));display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--accInk);transition:background .15s}
.wchk:hover i{background:color-mix(in srgb,var(--c) 25%,transparent)}
.wchk[aria-pressed=true] i{background:var(--acc);border-color:var(--acc)}
.wmain{text-align:left;padding:6px 0;min-width:0}
.wl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.wk .when b{color:var(--acc);font-weight:700}
.crs{font-family:"Noto Serif SC",serif;font-weight:900;font-size:17px;color:var(--c);letter-spacing:.01em}
.wk .m{align-items:baseline}.wk .wt{color:var(--ink);font-weight:600}
.cd{font-weight:600;white-space:nowrap}.cd.soon{color:var(--warn)}.cd.late{color:var(--bad)}.cd.now{color:var(--acc)}
.wk .tt{margin:1px 0 4px;font-size:15px;font-weight:600}
.wk .nt2{color:var(--mut)}
.wk.fin .tt{text-decoration:line-through;color:var(--mut)}
.wk.late{border-color:rgba(240,160,168,.45)}
.wk.now{border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.tact{margin-left:12px;color:var(--accInk);background:var(--acc);border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
@media(max-width:600px){.next{grid-template-columns:1fr}.next .nr{flex-direction:row;align-items:baseline;justify-content:space-between;text-align:left}.next .nr .btn{margin:0 0 0 auto}}
.inbox{border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:16px;padding:12px 14px;margin:0 0 14px;background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.ih{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}.ih b{color:var(--acc)}.ih span{font-size:12.5px;color:var(--mut)}
.ii{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ii .itk{font-weight:600}.ii .m{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--mut);margin-top:3px}
.ib{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ib .btn{height:34px;font-size:13px}
@media(max-width:600px){.ii{grid-template-columns:1fr}.ib{justify-content:flex-start}}
footer{padding:36px 0 40px;color:var(--mut);font-size:13px}
@media(max-width:600px){.sites{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.clock{text-align:left}.site{padding:12px;gap:10px}.site .ic{width:38px;height:38px;font-size:18px}}
@media(min-width:900px){
  .top{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
}
@media(prefers-reduced-motion:reduce){.site{transition:none}.site:hover{transform:none}}
</style>
</head>
<body>
<div id="app" hidden>
<header class="band snow">
  <div class="wrap">
    <div class="hello"><h1 class="disp" id="greet">你好，<i>Lyra</i></h1><div class="clock"><b id="clockT">--:--</b><span id="clockD"></span><br><button class="acct" data-act="acct" id="acctBtn">账号</button></div></div>
    <div class="top">
      <div class="term" role="region" aria-label="终端">
        <div class="bar"><i style="background:#e9b0c2"></i><i style="background:#e8c98e"></i><i style="background:#86d9c3"></i><span class="mono">lyra@ego: ~</span></div>
        <div class="out mono" id="out" aria-live="polite"></div>
        <form class="prompt mono" id="cmdForm"><label for="cmd">❯</label><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入命令，比如 todo 买雪地靴 明天"></form>
        <div class="hint"><button data-run="help">help</button><button data-run="today">today</button><button data-run="ddl">ddl</button><button data-run="北欧">北欧</button><button data-run="日记">日记</button></div>
      </div>
      <div class="side">
        <div class="tile"><h2><span id="todayTitle">今天的课</span><span><span id="todayNote" style="font-weight:400;margin-right:10px"></span><button class="tilebtn" data-act="tt">全部课表 →</button></span></h2><div id="today"></div></div>
        <div class="tile trip" id="trip"></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="s" id="sites-s">
    <div class="sh"><h2 class="disp">我的</h2><div style="display:flex;gap:8px"><button class="btn line" data-act="editsites" id="editBtn">编辑</button><button class="btn pri" data-act="addsite">+ 添加</button></div></div>
    <div class="sites" id="sites"></div>
  </section>
  <div class="cols">
    <section class="s" id="plans-s">
      <div class="sh"><h2 class="disp">计划<small id="planCount"></small></h2></div>
      <form class="addrow" id="planForm"><input type="text" id="planIn" placeholder="添加计划，比如：收拾北欧行李 周六" aria-label="新计划"><button class="btn pri" type="submit">添加</button></form>
      <div id="plans"></div>
    </section>
    <section class="s" id="work-s">

function renderToday(){
  const n=new Date(),now=`${pad(n.getHours())}:${pad(n.getMinutes())}`;let list=classesOn(n),title='今天的课',note='';
  if(!list.some(c=>c.e>now)){note=list.length?'今天的课已结束':'今天没课';list=[];const t=new Date(n);
    for(let i=1;i<=14;i++){t.setDate(n.getDate()+i);const l=classesOn(t);if(l.length){title=i===1?'明天的课':`下次上课 · ${t.getMonth()+1}/${t.getDate()} 周${WD[t.getDay()]}`;list=l;break}}}
  $('#todayTitle').textContent=title;$('#todayNote').textContent=note;
  const isToday=title==='今天的课';
  $('#today').innerHTML=list.length?list.map(c=>{const st=isToday?(c.e<=now?'past':c.s<=now?'now':''):'';return `<div class="cls ${st}"><span class="t mono">${c.s}–${c.e}</span><b><span class="dot" style="background:${cColor(c.course)}"></span> ${esc(c.course)} · ${esc(c.type)}${st==='now'?' · 进行中':''}</b><small>${esc(c.room)}</small></div>`}).join(''):'<div class="empty">接下来两周没有课。</div>';
  $('#today').closest('.tile').hidden=!S.tt.length;$('#trip').hidden=!S.trip;if(!S.trip)return;
  const s=pd(S.trip.start),e=pd(S.trip.end),t0=pd(dk(n));const d=Math.round((s-t0)/864e5),after=Math.round((t0-e)/864e5);
  const tu=safeUrl(S.trip.url);

/* ---------- plans ---------- */
function parseDue(text){
  const n=new Date();let due=null,t=text;
  const set=d=>{due=dk(d)};
  const rel={'今天':0,'今晚':0,'明天':1,'后天':2,'大后天':3};
  for(const [k,v] of Object.entries(rel)){const re=new RegExp('(^|\\s)'+k+'(\\s|$)');if(re.test(t)){const d=new Date(n);d.setDate(d.getDate()+v);set(d);t=t.replace(re,' ');break}}
  let m;
  if(!due&&(m=t.match(/(^|\s)(下)?(周|星期)([一二三四五六日天])(\s|$)/))){const target='日一二三四五六'.indexOf(m[4]==='天'?'日':m[4]);const d=new Date(n);let diff=(target-d.getDay()+7)%7;if(m[2])diff+=7;else if(diff===0)diff=7;d.setDate(d.getDate()+diff);set(d);t=t.replace(m[0],' ')}
  if(!due&&(m=t.match(/(^|\s)(\d{1,2})[\/.月](\d{1,2})日?(\s|$)/))){let d=new Date(n.getFullYear(),+m[2]-1,+m[3]);if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()-30))d.setFullYear(d.getFullYear()+1);set(d);t=t.replace(m[0],' ')}
  return{text:t.replace(/\s+/g,' ').trim(),due}}
function dueLabel(due){if(!due)return{t:'',c:''};const t0=pd(dk(new Date())),d=pd(due),x=Math.round((d-t0)/864e5);
  return{t:x===0?'今天':x===1?'明天':x===-1?'昨天':x<0?`过期 ${-x} 天`:x<7?`周${WD[d.getDay()]}`:`${d.getMonth()+1}/${d.getDate()}`,c:x<0?'late':x<=1?'soon':''}}
function addPlan(raw){const {text,due}=parseDue(raw);if(!text)return null;const p={id:uid(),text:text.slice(0,200),due,done:false,created:Date.now()};S.plans.push(p);DB.put('plans',p);renderPlans();return p}
function renderPlans(){
  const today=dk(new Date());const open=S.plans.filter(p=>!p.done),done=S.plans.filter(p=>p.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const g1=open.filter(p=>p.due&&p.due<=today).sort((a,b)=>a.due.localeCompare(b.due)),g2=open.filter(p=>p.due&&p.due>today).sort((a,b)=>a.due.localeCompare(b.due)),g3=open.filter(p=>!p.due).sort((a,b)=>a.created-b.created);
  const row=p=>{const d=dueLabel(p.due);return `<div class="todo ${p.done?'done':''}"><button class="chk" data-chk="${esc(p.id)}" aria-pressed="${p.done}" aria-label="完成"><i>${p.done?'✓':''}</i></button><button class="tx" data-editplan="${esc(p.id)}">${esc(p.text)}</button><span class="due ${d.c}">${d.t}</span></div>`};
  const grp=(n,l)=>l.length?`<div class="grp">${n} · ${l.length}</div>${l.map(row).join('')}`:'';
  $('#planCount').textContent=open.length?`${open.length} 件待办`:'';
  $('#plans').innerHTML=(open.length?grp('今天 / 已到期',g1)+grp('接下来',g2)+grp('没有日期',g3):'<div class="empty">没有待办。在上面输入，或者在终端里打 <span class="mono">todo 内容 明天</span>。</div>')+
   (done.length?`<div class="grp"><button data-act="togdone" style="color:var(--mut)">${S.showDone?'收起':'显示'}已完成 · ${done.length}</button></div>${S.showDone?done.slice(0,50).map(row).join(''):''}`:'');
}

    if(a==='del'){S.plans=S.plans.filter(x=>x!==p);DB.del('plans',p.id)}else{const t=$('#pT').value.trim();if(!t)return;p.text=t.slice(0,200);p.due=$('#pD').value||null;DB.put('plans',p)}

async function loadInbox(){if(!INBOX)return;try{const q=await INBOX.limit(100).get();S.inbox=q.docs.filter(d=>d.exists).map(d=>({...structuredClone(d.data()),_id:d.id})).filter(x=>x&&typeof x.task==='string').sort((a,b)=>String(a.date||'9').localeCompare(String(b.date||'9')))}catch(e){S.inbox=[]}renderInbox()}
function renderInbox(){const el=$('#inbox');if(!el)return;if(!S.inbox.length){el.innerHTML='';return}
  el.innerHTML=`<div class="inbox"><div class="ih"><b>新消息 · ${S.inbox.length}</b><span>每天自动从邮件和 Moodle 通知里找到的</span></div>${S.inbox.map(x=>{const u=safeUrl(x.link);const isD=x.kind!=='notice'&&x.date;return `<div class="ii" style="--c:${cColor(x.course||'')}"><div style="min-width:0">${x.course?`<span class="crs" style="font-size:15px">${esc(x.course)}</span> `:''}<span class="itk">${esc(x.task)}</span><div class="m">${x.date?`<span class="when"><b>${md(String(x.date))}</b>${x.time?' · '+esc(x.time):''}</span>`:''}${x.weight?`<span>${esc(x.weight)}</span>`:''}${x.note?`<span>${esc(x.note)}</span>`:''}${u?`<a href="${esc(u)}" style="color:var(--acc)">查看 →</a>`:''}</div></div><div class="ib">${isD?`<button class="btn pri" data-inadd="${esc(x._id)}">加入 DDL</button>`:''}<button class="btn line" data-inno="${esc(x._id)}">${isD?'忽略':'知道了'}</button></div></div>`}).join('')}</div>`}
async function inboxResolve(id,add){const x=S.inbox.find(y=>y._id===id);if(!x)return;
  if(add){const it={id:uid(),status:S0,course:String(x.course||'').slice(0,40),task:String(x.task).slice(0,140),date:/^\d{4}-\d\d-\d\d$/.test(x.date)?x.date:null,time:/^\d\d:\d\d$/.test(x.time||'')?x.time:'',weight:String(x.weight||'').slice(0,40),note:String(x.note||'').slice(0,300)};S.work.push(it);await DB.put('work',it);renderWork();toast('已加入 DDL')}
  S.inbox=S.inbox.filter(y=>y!==x);renderInbox();try{await INBOX.doc(id).delete()}catch(e){}}
/* ---------- DDL ---------- */
const STS=[S0,S1,S2,S3];
const isFin=w=>w.status===S2||w.status===S1;
const md=s=>`${+s.slice(5,7)}/${+s.slice(8)}`;
const atTime=(date,t,fallback)=>{const d=pd(date);const [h,m]=(t&&/^\d\d:\d\d$/.test(t)?t:fallback).split(':').map(Number);d.setHours(h,m);return d};
const startOf=w=>w.date?atTime(w.date,w.time,'23:59'):null;
const endOf=w=>w.date?atTime(w.dateEnd||w.date,w.endTime||w.time,'23:59'):null;
const fmtLeft=ms=>{const h=Math.floor(ms/36e5),m=Math.max(1,Math.floor(ms%36e5/6e4));return h?`${h} 小时${h<10&&m?` ${m} 分`:''}`:`${m} 分钟`};
function workSorted(){return [...S.work].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99')||(a.course||'').localeCompare(b.course||''))}
function workDue(w){
  if(!w.date)return{t:'日期待定',c:''};
  const n=new Date(),today=pd(dk(n)),days=Math.round((pd(w.date)-today)/864e5);
  if(w.approx)return days>0?{t:`约 ${days} 天后`,c:''}:{t:'快到了',c:'soon'};
  const st=startOf(w),en=endOf(w);
  if(en<n){const ago=Math.round((today-pd(dk(en)))/864e5);return{t:ago?`已过 ${ago} 天`:'今天已截止',c:'late'}}
  if(st<=n)return{t:`进行中 · 还剩 ${fmtLeft(en-n)}`,c:'now'};
  if(days===0)return{t:`今天 ${w.time||''} · 还剩 ${fmtLeft(st-n)}`,c:'soon'};
  if(days===1)return{t:`明天 ${w.time||''}`,c:'soon'};
  return{t:`还有 ${days} 天`,c:days<=3?'soon':''};
}
function whenText(w){
  if(w.approx)return w.approx;
  if(!w.date)return '待定';
  return `${md(w.date)}${w.dateEnd?'–'+md(w.dateEnd):''}${w.time?' '+w.time+(w.endTime?'–'+w.endTime:''):''}`;
}
function groupLabel(w){
  if(w.group)return w.group;if(!w.date)return '日期待定';
  const y=+w.date.slice(0,4),m=+w.date.slice(5,7);return y===new Date().getFullYear()?`${m}月`:`${y}年${m}月`;
}
let lastUndo=null;
function setDone(w,done){const prev=w.status;w.status=done?S2:S0;DB.put('work',w);renderWork();
  lastUndo=()=>{w.status=prev;DB.put('work',w);renderWork()};
  toast(done?`✓ 完成：${w.task}`:`已恢复：${w.task}`,{label:'撤销',fn:()=>{if(lastUndo){lastUndo();lastUndo=null}}})}
function renderWork(){
  const courses=[...new Set(S.work.map(w=>cKey(w.course)))].filter(Boolean).sort();
  $('#workChips').innerHTML=[['todo','待办'],['all','全部'],['fin','已完成']].map(([k,n])=>`<button class="chip" data-wf="${k}" aria-pressed="${S.wf===k}">${n}</button>`).join('')+`<span style="width:1px;background:var(--line);flex:none"></span>`+
    [['all','全部课程'],...courses.map(c=>[c,c])].map(([k,n])=>`<button class="chip" data-wc="${esc(k)}" aria-pressed="${S.wc===k}">${k!=='all'?`<span class="dot" style="background:${cColor(k)}"></span>`:''}${esc(n)}</button>`).join('');
  const now=new Date();
  const pool=workSorted().filter(w=>S.wc==='all'||cKey(w.course)===S.wc);
  const open=S.work.filter(w=>!isFin(w)),soon=open.filter(w=>['soon','now'].includes(workDue(w).c)).length,late=open.filter(w=>workDue(w).c==='late').length;
  $('#workCount').textContent=`${open.length} 项待办${soon?` · ${soon} 项很近`:''}${late?` · ${late} 项已过期`:''}`;
  let html='';
  let list=pool;
  if(S.wf==='todo')list=pool.filter(w=>!isFin(w));else if(S.wf==='fin')list=pool.filter(isFin).reverse();
  if(!list.length){html+=`<div class="empty">${S.wf==='todo'?'没有待办的 DDL，太棒了。':'这里还没有内容。'}</div>`}
  else{const groups=[];for(const w of list){const g=groupLabel(w);let G=groups.find(x=>x.g===g);if(!G)groups.push(G={g,items:[]});G.items.push(w)}
    html+=groups.map(G=>{const all=pool.filter(w=>groupLabel(w)===G.g),dn=all.filter(isFin).length;
      return `<div class="mon"><b>${esc(G.g)}</b><span>${dn}/${all.length} 完成</span><i><em style="width:${all.length?dn/all.length*100:0}%"></em></i></div>`+G.items.map(w=>{const du=workDue(w),f=isFin(w),d=w.date&&!w.approx?pd(w.date):null;
        return `<div class="wk ${f?'fin':''} ${!f?du.c:''}" style="--c:${cColor(w.course)}">
        <button class="wchk" data-wdone="${esc(w.id)}" aria-pressed="${f}" aria-label="${f?'标记为未完成':'标记为完成'}"><i>${f?'✓':''}</i></button>
        <button class="wmain" data-editwork="${esc(w.id)}">
          <div class="wl"><span class="crs">${esc(w.course)}</span>${!f?`<span class="cd ${du.c}">${du.t}</span>`:''}</div>
          <div class="tt">${esc(w.task)}</div>
          <div class="m"><span class="when">${d?`<b>${d.getMonth()+1}/${d.getDate()}</b> 周${WD[d.getDay()]}`:'<b>'+esc(whenText(w))+'</b>'}${d&&w.dateEnd?` 至 ${md(w.dateEnd)}`:''}${d&&w.time?` · ${w.time}${w.endTime?'–'+w.endTime:''}`:''}</span>${w.weight?`<span class="wt">${esc(w.weight)}</span>`:''}${w.note?`<span class="nt2">${esc(w.note)}</span>`:''}</div>
        </button></div>`}).join('')}).join('')}
  const doneN=pool.filter(isFin).length;
  if(S.wf==='todo'&&doneN)html+=`<button class="chip" style="margin-top:6px" data-wf="fin">看已完成的 ${doneN} 项</button>`;
  $('#work').innerHTML=html;
}
function workModal(w){
  const it=w||{date:dk(new Date()),time:'',course:'',task:'',weight:'',status:S0,note:''};
  modal(`<h3>${w?'编辑 DDL':'新 DDL'}</h3><div class="field"><label for="wT">任务</label><input type="text" id="wT" value="${esc(it.task)}"></div>
  <div class="two"><div class="field"><label for="wC">课程</label><input type="text" id="wC" value="${esc(it.course)}" placeholder="CHEM0006"></div><div class="field"><label for="wW">占比</label><input type="text" id="wW" value="${esc(it.weight)}" placeholder="10%"></div></div>
  <div class="two"><div class="field"><label for="wD">日期</label><input type="date" id="wD" value="${esc(it.date||'')}"></div><div class="field"><label for="wD2">结束日期（可不填）</label><input type="date" id="wD2" value="${esc(it.dateEnd||'')}"></div></div>
  <div class="two"><div class="field"><label for="wH">时间</label><input type="time" id="wH" value="${esc(/^\d\d:\d\d$/.test(it.time||'')?it.time:'')}"></div><div class="field"><label for="wH2">结束时间（可不填）</label><input type="time" id="wH2" value="${esc(/^\d\d:\d\d$/.test(it.endTime||'')?it.endTime:'')}"></div></div>
  <div class="field"><label for="wA">日期还没定？写个大概（如：1/11 那周）</label><input type="text" id="wA" value="${esc(it.approx||'')}"></div>
  <div class="field"><label for="wN">备注</label><textarea id="wN" rows="2">${esc(it.note)}</textarea></div>
  <label style="display:flex;gap:10px;align-items:center;min-height:44px"><input type="checkbox" id="wS" ${isFin(it)?'checked':''} style="width:20px;height:20px;accent-color:var(--acc)"> 已完成</label>
  <div class="row">${w?'<button class="btn danger sp" data-a="del">删除</button>':''}<button class="btn line" data-a="no">取消</button><button class="btn pri" data-a="ok">保存</button></div>`);
  $('#box').onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='no')return closeModal();
    if(a==='del'){S.work=S.work.filter(x=>x!==w);DB.del('work',w.id);closeModal();renderWork();toast('已删除',{label:'撤销',fn:()=>{S.work.push(w);DB.put('work',w);renderWork()}});return}
    const task=$('#wT').value.trim();if(!task)return $('#wT').focus();
    const o=w||{id:uid()};Object.assign(o,{task:task.slice(0,140),course:$('#wC').value.trim().slice(0,40),weight:$('#wW').value.trim().slice(0,40),date:$('#wD').value||null,dateEnd:$('#wD2').value||'',time:$('#wH').value||'',endTime:$('#wH2').value||'',approx:$('#wA').value.trim().slice(0,40),note:$('#wN').value.trim().slice(0,300),status:$('#wS').checked?S2:S0});
    if(!w)S.work.push(o);DB.put('work',o);closeModal();renderWork()};
}

/* ---------- full timetable ---------- */
let ttTerm=null;
function ttModal(){
  const all=S.tt||[],weekly=all.filter(c=>!c.date),once=all.filter(c=>c.date);
  const terms=[...new Set(weekly.map(c=>c.from<'2027-01-01'?'Term 1':'Term 2'))];
  const today=dk(new Date());
  if(!ttTerm)ttTerm=weekly.some(c=>c.from<=today&&c.to>=today)?(weekly.find(c=>c.from<=today&&c.to>=today).from<'2027-01-01'?'Term 1':'Term 2'):(terms[0]||'Term 1');
  const inTerm=weekly.filter(c=>(c.from<'2027-01-01'?'Term 1':'Term 2')===ttTerm);
  const days=[1,2,3,4,5].map(wd=>{const l=inTerm.filter(c=>c.wd===wd).sort((a,b)=>a.s.localeCompare(b.s));return l.length?`<div class="tt-day">星期${WD[wd]}</div>`+l.map(c=>`<div class="cls"><span class="t mono">${c.s}–${c.e}</span><b><span class="dot" style="background:${cColor(c.course)}"></span> ${esc(c.course)} · ${esc(c.type)}</b><small>${esc(c.room)} · ${md(c.from)}–${md(c.to)}${c.except&&c.except.length?` · ${c.except.map(md).join('、')} 不上`:''}</small></div>`).join(''):''}).join('');
  const up=once.filter(c=>c.date>=today).sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s));
  const OFFICIAL='https://timetable.ucl.ac.uk/tt/homePage.do';
  modal(`<h3>全部课表</h3><div class="chips">${terms.map(t=>`<button class="chip" data-tt="${t}" aria-pressed="${t===ttTerm}">${t}</button>`).join('')}</div>
   ${days||'<p class="empty">这个学期没有每周课程。</p>'}
   ${up.length?`<div class="tt-day" style="color:var(--acc2)">实验、测试等单次安排</div>`+up.map(c=>{const d=pd(c.date);return `<div class="cls"><span class="t mono">${md(c.date)} 周${WD[d.getDay()]}</span><b><span class="dot" style="background:${cColor(c.course)}"></span> ${esc(c.course)} · ${esc(c.type)}</b><small>${c.s}–${c.e} · ${esc(c.room)}</small></div>`}).join(''):''}
   <div class="row"><a class="btn line sp" href="${OFFICIAL}">UCL 官方课表 →</a><button class="btn pri" data-a="no">关闭</button></div>`);
  $('#box').classList.add('wide');
  $('#box').onclick=e=>{const t=e.target.closest('[data-tt]');if(t){ttTerm=t.dataset.tt;ttModal();return}if(e.target.closest('[data-a=no]'))closeModal()};
}
/* ---------- modal ---------- */
function modal(h){$('#box').classList.remove('wide');$('#box').innerHTML=h;$('#modal').hidden=false;setTimeout(()=>$('#box input')?.focus(),50)}
function closeModal(){$('#modal').hidden=true;$('#box').onclick=null;$('#box').classList.remove('wide')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#cmd').focus()}});

/* ---------- terminal ---------- */
const hist=[];let hi=0;
function print(text,cls='',html=false){const p=document.createElement('p');if(cls)p.className=cls;if(html)p.innerHTML=text;else p.textContent=text;const o=$('#out');o.appendChild(p);while(o.children.length>60)o.firstChild.remove();o.scrollTop=o.scrollHeight}
function linkLine(x){const u=safeUrl(x.url);return u?`→ <a href="${esc(u)}">${esc(x.name)}</a>  <span style="color:var(--mut)">${esc(x.desc||'')}</span>`:esc(x.name)}
const HELP=[['help','显示这些命令'],['todo 内容 [明天/周五/12/3]','加一条计划'],['done 关键词','把计划标记完成'],['today','今天/下次的课'],['课表','打开全部课表'],['ddl','最近 7 天的截止日期'],['北欧','旅行倒计时和安排'],['日记 / ddl表 / 奶蛋 …','打开对应网站'],['sites','列出所有网站'],['clear','清屏']];
function run(raw){
  const line=raw.trim();if(!line)return;hist.push(line);hi=hist.length;print('❯ '+line,'cmd');
  const [c0,...rest]=line.split(/\s+/);const c=c0.toLowerCase(),arg=rest.join(' ');
  if(c==='help'||c==='?'||c==='帮助'){HELP.forEach(([a,b])=>print(`  ${a.padEnd(22,' ')} ${b}`));return}
  if(c==='clear'||c==='cls'){$('#out').innerHTML='';return}
  if(['todo','计划','+','add'].includes(c)){const p=arg&&addPlan(arg);if(p)print(`✓ 已加入计划：${p.text}${p.due?`（${dueLabel(p.due).t}）`:''}`,'ok');else print('用法：todo 内容 [明天/周五/12/3]','err');return}
  if(c==='done'||c==='完成'){const p=S.plans.find(x=>!x.done&&x.text.toLowerCase().includes(arg.toLowerCase()));if(!arg||!p)return print('没找到这条计划','err');p.done=true;p.doneAt=Date.now();DB.put('plans',p);renderPlans();print(`✓ 完成：${p.text}`,'ok');return}
  if(c==='课表'||c==='tt'||c==='timetable'){ttModal();return}
  if(c==='today'||c==='今天'||c==='课'){const l=classesOn(new Date());if(!l.length)print('今天没有课。');l.forEach(x=>print(`  ${x.s}–${x.e}  ${x.course} ${x.type} @ ${x.room}`));return}
  if(c==='ddl'||c==='work'||c==='作业'){const now=new Date(),lim=new Date(now);lim.setDate(lim.getDate()+7);const l=workSorted().filter(w=>!isFin(w)&&w.date&&!w.approx&&pd(w.date)<=lim&&endOf(w)>=now);
    if(!l.length)print('未来 7 天没有截止的作业。','ok');l.forEach(w=>print(`  ${whenText(w)}  ${w.course}  ${w.task}  [${workDue(w).t}]`,workDue(w).c==='late'?'err':''));$('#work-s').scrollIntoView({behavior:'smooth'});return}
  if((c==='北欧'||c==='nordic'||c==='trip')&&!S.trip)return print('还没有设置旅行。','err');
  if(c==='北欧'||c==='nordic'||c==='trip'){const d=Math.round((pd(S.trip.start)-pd(dk(new Date())))/864e5);print(d>0?`还有 ${d} 天出发去北欧 ✈`:'北欧之旅进行中或已结束','ok');S.trip.plan.forEach(p=>print(`  ${p[0].padEnd(8,' ')} ${p[1]}`));if(safeUrl(S.trip.url))print(linkLine({name:'完整行程',url:S.trip.url,desc:''}),'',true);return}
  if(c==='sites'||c==='ls'||c==='网站'){S.sites.forEach(x=>print(linkLine(x),'',true));return}
  const q=(c==='open'||c==='o'?arg:line).toLowerCase();const alias={ddl表:'ddl 表',moodle表:'ddl 表',日记:'日记',奶蛋:'奶蛋',酶:'酶'};
  const key=alias[q]||q;const hit=S.sites.filter(x=>(x.name+' '+(x.desc||'')).toLowerCase().includes(key));
  if(hit.length){hit.slice(0,4).forEach(x=>print(linkLine(x),'',true));return}
  print(`找不到命令「${c0}」。输入 help 看看能做什么。`,'err');
}
$('#cmdForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#cmd').value;$('#cmd').value='';run(v)});
$('#cmd').addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);$('#cmd').value=hist[hi];e.preventDefault()}else if(e.key==='ArrowDown'&&hist.length){hi=Math.min(hist.length,hi+1);$('#cmd').value=hist[hi]||'';e.preventDefault()}});

/* ---------- events ---------- */
$('#planForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#planIn').value;if(addPlan(v))$('#planIn').value=''});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.closest('#box,#auth'))return;const d=b.dataset;
  if(d.run){run(d.run);return}
  if(d.editsite){e.preventDefault();siteModal(S.sites.find(x=>x.id===d.editsite));return}
  if(d.chk){const p=S.plans.find(x=>x.id===d.chk);if(p){p.done=!p.done;p.doneAt=Date.now();DB.put('plans',p);renderPlans()}return}
  if(d.editplan){const p=S.plans.find(x=>x.id===d.editplan);if(p)planModal(p);return}
  if(d.inadd){inboxResolve(d.inadd,true);return}if(d.inno){inboxResolve(d.inno,false);return}
  if(d.wdone){const w=S.work.find(x=>x.id===d.wdone);if(w)setDone(w,!isFin(w));return}
  if(d.editwork){const w=S.work.find(x=>x.id===d.editwork);if(w)workModal(w);return}
  if(d.wf){S.wf=d.wf;renderWork();return}
  if(d.wc){S.wc=d.wc;renderWork();return}
  const a=d.act;if(a==='acct')return acctModal();if(a==='tt')return ttModal();if(a==='retry'&&S.account)return enterAccount(S.account,S.key,false);if(a==='editsites'){S.editing=!S.editing;renderSites()}else if(a==='addsite')siteModal(null);else if(a==='addwork')workModal(null);else if(a==='togdone'){S.showDone=!S.showDone;renderPlans()}
});
document.addEventListener('click',e=>{const a=e.target.closest('a.site');if(a&&S.editing){e.preventDefault();siteModal(S.sites.find(x=>x.id===a.dataset.site))}},true);


function renderAll(){renderToday();renderSites();renderPlans();renderWork()}
tick();
print('欢迎回来。输入 help 查看命令，按 / 可以随时跳到这里。','ok');
boot();
}
</script>
